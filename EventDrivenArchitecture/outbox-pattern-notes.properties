# ???????????????????????????????????????????????????????????????????????????????
# ?         OUTBOX PATTERN ? COMPLETE SENIOR-LEVEL NOTES                      ?
# ?                    In-Depth Explanation + Code Examples                    ?
# ???????????????????????????????????????????????????????????????????????????????
# ?  Covers: Dual-write problem, Outbox table design, Polling publisher,     ?
# ?          CDC (Change Data Capture) approach, Debezium, Idempotency,      ?
# ?          Ordering guarantees, Spring Boot implementation, Edge cases     ?
# ???????????????????????????????????????????????????????????????????????????????
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 1. THE PROBLEM ? Dual Write
# ???????????????????????????????????????????????????????????????????????????????
#
# Look at your current Order Service code:
#
#   @PostMapping("/api/orders")
#   public ResponseEntity<String> createOrder(@RequestBody Order order) {
#       // Step 1: Save to Database
#       orderRepository.save(order);
#
#       // Step 2: Publish event to Kafka
#       kafkaTemplate.send("order-events", order.getOrderId(), order);
#
#       return ResponseEntity.ok("Order created!");
#   }
#
# This looks correct. But it has a CRITICAL flaw.
#
# You are writing to TWO systems:
#   1. Database (PostgreSQL/MySQL)
#   2. Kafka (message broker)
#
# These are TWO INDEPENDENT systems. There is NO transaction that spans both.
#
#
# ?????????????????????????????????????????????????????
# 1.1 Why can't we just use @Transactional?
# ?????????????????????????????????????????????????????
#
#   @Transactional   ? this is a DATABASE transaction only!
#   public void createOrder(Order order) {
#       orderRepository.save(order);            // DB write
#       kafkaTemplate.send("order-events", ...) // Kafka write
#   }
#
#   @Transactional controls the DATABASE. It does NOT control Kafka.
#   Kafka has its OWN transaction system (which we covered in Kafka Transactions).
#   But a Kafka transaction and a DB transaction are SEPARATE.
#
#   There is no "single transaction" that commits to BOTH Postgres AND Kafka
#   atomically. They are different systems, different protocols, different servers.
#
#
# ?????????????????????????????????????????????????????
# 1.2 The 4 failure scenarios
# ?????????????????????????????????????????????????????
#
#   SCENARIO 1: DB succeeds, Kafka fails
#   ?????????????????????????????????????
    #     orderRepository.save(order);          ? saved to DB
    #     kafkaTemplate.send("order-events");   ? Kafka is down / network timeout
    #
    #     Result: Order exists in DB, but NO event published.
    #     ? Payment service never gets notified
    #     ? Inventory never decremented
    #     ? Customer sees "order placed" but nothing happens
    #
    #     This is DATA INCONSISTENCY.
#
#
#   SCENARIO 2: Kafka succeeds, DB fails
#   ?????????????????????????????????????
#     kafkaTemplate.send("order-events");   ? event published to Kafka
#     orderRepository.save(order);          ? DB connection lost / constraint violation
#
#     Result: Event published, but order doesn't exist in DB.
#     ? Payment service processes a non-existent order
#     ? Inventory decremented for a phantom order
#
#     WORSE than Scenario 1.
#
#
#   SCENARIO 3: App crashes BETWEEN the two writes
#   ?????????????????????????????????????
#     orderRepository.save(order);          ? saved to DB
#     // ? APP CRASHES HERE (OutOfMemoryError, kill -9, pod restart)
#     kafkaTemplate.send("order-events");   ? never executed
#
#     Result: Same as Scenario 1. Order in DB, no event.
#
#
#   SCENARIO 4: Both succeed but in wrong order
#   ?????????????????????????????????????
#     kafkaTemplate.send("order-events");   ? event published
#     // Consumer picks up event IMMEDIATELY
#     // Consumer calls GET /orders/ORD-1 ? 404 (not in DB yet!)
#     orderRepository.save(order);          ? saved to DB (but too late)
#
#     Result: Race condition. Consumer sees event before DB is ready.
#
#
# ?????????????????????????????????????????????????????
# 1.3 Visual: The dual-write problem
# ?????????????????????????????????????????????????????
#
#   Your Service
#       ?
#       ????? Write 1 ????? [ Database ]     ? or ?
#       ?
#       ????? Write 2 ????? [ Kafka ]        ? or ?
#
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 2. THE SOLUTION ? Outbox Pattern
# ???????????????????????????????????????????????????????????????????????????????
#
# The idea is simple:
#
#   "Don't write to Kafka directly. Write to a DATABASE TABLE instead.
#    Then a separate process reads that table and publishes to Kafka."
#
# The database table is called the "OUTBOX TABLE."
#
#
# ?????????????????????????????????????????????????????
# 2.1 The core insight
# ?????????????????????????????????????????????????????
#
#   BEFORE (dual-write ? BROKEN):
#
#     Your Service
#         ?
#         ????? Write 1 ????? [ Database ]    ? Transaction 1
#         ?
#         ????? Write 2 ????? [ Kafka ]       ? Transaction 2 (separate!)
#
#     Two systems, two transactions, no atomicity.
#
#
#   AFTER (outbox pattern ? CORRECT):
#
#     Your Service
#         ?
#         ????? Write 1 + Write 2 ????? [ Database ]   ? ONE transaction!
#               (order table)    (outbox table)
#
#         Separate Process (Poller / CDC)
#         ?
#         ????? Read outbox table ????? [ Kafka ]
#
#     Both writes go to the SAME database, in the SAME transaction.
#     Database guarantees: both succeed or both fail. ATOMICITY.
#
#
# ?????????????????????????????????????????????????????
# 2.2 How it works step by step
# ?????????????????????????????????????????????????????
#
#   Step 1: Service receives "create order" request
#
#   Step 2: In ONE database transaction:
#     a) INSERT into orders table (orderId, customerId, amount, status)
#     b) INSERT into outbox table (eventType, aggregateId, payload)
#     ? COMMIT
#
#   Step 3: A separate process (we'll cover two approaches):
#     a) Reads new rows from the outbox table
#     b) Publishes each row as a Kafka message
#     c) Marks the row as "published" (or deletes it)
#
#   If Step 2 fails (DB error) ? BOTH inserts are rolled back.
#     ? No order in DB, no outbox row, no Kafka event. CONSISTENT.
#
#   If Step 3 fails (Kafka down) ? Outbox row stays unpublished.
#     ? Poller retries later. Event is eventually published. CONSISTENT.
#
#   If Step 3 succeeds but marking as "published" fails ?
#     ? Poller re-reads the row, publishes again (DUPLICATE).
#     ? That's why consumers MUST be idempotent. (we'll cover this)
#
#
# ?????????????????????????????????????????????????????
# 2.3 Visual: The full flow
# ?????????????????????????????????????????????????????
#
#   ???????????????????????????????????????????????????????????????????????
#   ?                        DATABASE                                    ?
#   ?                                                                    ?
#   ?   ????????????????????      ????????????????????????????????????  ?
#   ?   ?   orders table   ?      ?         outbox table             ?  ?
#   ?   ?                  ?      ?                                  ?  ?
#   ?   ? ORD-1 | CUST-1   ?      ? id | aggregate_id | event_type  ?  ?
#   ?   ? ORD-2 | CUST-2   ?      ?    | payload      | published   ?  ?
#   ?   ?                  ?      ?                                  ?  ?
#   ?   ?                  ?      ? 1  | ORD-1 | ORDER_CREATED      ?  ?
#   ?   ?                  ?      ?    | {...} | false               ?  ?
#   ?   ?                  ?      ?                                  ?  ?
#   ?   ?                  ?      ? 2  | ORD-2 | ORDER_CREATED      ?  ?
#   ?   ?                  ?      ?    | {...} | false               ?  ?
#   ?   ????????????????????      ????????????????????????????????????  ?
#   ?                                             ?                     ?
#   ?            ? SAME DB TRANSACTION ?          ?                     ?
#   ?????????????????????????????????????????????????????????????????????
#                                                 ?
#                                                 ? Poller reads
#                                                 ? unpublished rows
#                                                 ?
#                                        ????????????????????
#                                        ?  Outbox Poller   ?
#                                        ?  (Scheduled Job) ?
#                                        ????????????????????
#                                                 ?
#                                                 ? Publishes to Kafka
#                                                 ?
#                                        ????????????????????
#                                        ?      Kafka       ?
#                                        ?  (order-events)  ?
#                                        ????????????????????
#
#
# ?????????????????????????????????????????????????????
# 2.4 Why is this called "Outbox"?
# ?????????????????????????????????????????????????????
#
#   Think of a physical office:
#     - You write a letter (create the order)
#     - You put it in the "outbox" tray on your desk (insert into outbox table)
#     - A mail carrier comes periodically, picks up letters from
#       the outbox, and delivers them (poller publishes to Kafka)
#
#   The outbox tray decouples "writing the letter" from "delivering the letter."
#   If the mail carrier is sick today, the letter stays in the outbox.
#   Tomorrow, a new mail carrier picks it up. The letter is NEVER lost.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 3. THE OUTBOX TABLE ? Design and Schema
# ???????????????????????????????????????????????????????????????????????????????
#
# The outbox table is a regular database table in YOUR service's database.
# It stores events that NEED to be published to Kafka.
#
#
# ?????????????????????????????????????????????????????
# 3.1 Table schema
# ?????????????????????????????????????????????????????
#
#   CREATE TABLE outbox_events (
#       id              UUID PRIMARY KEY,           -- unique event ID
#       aggregate_type  VARCHAR(255) NOT NULL,       -- "Order", "Payment", "Customer"
#       aggregate_id    VARCHAR(255) NOT NULL,       -- "ORD-1", "PAY-100"
#       event_type      VARCHAR(255) NOT NULL,       -- "ORDER_CREATED", "ORDER_CANCELLED"
#       payload         TEXT NOT NULL,               -- JSON of the event data
#       created_at      TIMESTAMP NOT NULL,          -- when the event was created
#       published       BOOLEAN DEFAULT FALSE,       -- has it been sent to Kafka?
#       published_at    TIMESTAMP NULL               -- when it was sent
#   );
#
#   Let's understand each column:
#
#   ???????????????????????????????????????????????????????????????????????????
#   ? Column           ? Purpose                                             ?
#   ???????????????????????????????????????????????????????????????????????????
#   ? id               ? Unique ID for this event (UUID). Used for           ?
#   ?                  ? idempotency ? consumer can deduplicate by this ID   ?
#   ???????????????????????????????????????????????????????????????????????????
#   ? aggregate_type   ? What entity this event is about: "Order"            ?
#   ?                  ? Used to determine which Kafka TOPIC to publish to   ?
#   ?                  ? e.g., aggregate_type = "Order" ? topic "order-events"?
#   ???????????????????????????????????????????????????????????????????????????
#   ? aggregate_id     ? The ID of the entity: "ORD-1"                       ?
#   ?                  ? Used as the Kafka message KEY                        ?
#   ?                  ? ? ensures ordering per entity (same partition)       ?
#   ???????????????????????????????????????????????????????????????????????????
#   ? event_type       ? What happened: "ORDER_CREATED", "ORDER_CANCELLED"   ?
#   ?                  ? Consumers use this to decide how to handle the event ?
#   ???????????????????????????????????????????????????????????????????????????
#   ? payload          ? The actual event data as JSON string                 ?
#   ?                  ? Contains everything the consumer needs               ?
#   ?                  ? e.g., {"orderId":"ORD-1","amount":500,...}           ?
#   ???????????????????????????????????????????????????????????????????????????
#   ? published        ? FALSE = not yet sent to Kafka. Poller picks these up?
#   ?                  ? TRUE  = sent to Kafka. Can be cleaned up later       ?
#   ???????????????????????????????????????????????????????????????????????????
#   ? created_at       ? When the event was created. Poller reads in ORDER    ?
#   ?                  ? of created_at to preserve event ordering             ?
#   ???????????????????????????????????????????????????????????????????????????
#
#
# ?????????????????????????????????????????????????????
# 3.2 Example: What the outbox table looks like after 3 orders
# ?????????????????????????????????????????????????????
#
#   id       | aggregate_type | aggregate_id | event_type      | payload                              | published | created_at
#   ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
#   uuid-1   | Order          | ORD-1        | ORDER_CREATED   | {"orderId":"ORD-1","amount":500,...} | false     | 2024-01-01 10:00:00
#   uuid-2   | Order          | ORD-2        | ORDER_CREATED   | {"orderId":"ORD-2","amount":300,...} | false     | 2024-01-01 10:01:00
#   uuid-3   | Order          | ORD-1        | ORDER_CANCELLED | {"orderId":"ORD-1","reason":"..."}   | false     | 2024-01-01 10:02:00
#
#   Notice: ORD-1 has TWO events (created and cancelled).
#   The poller will publish them IN ORDER (by created_at).
#   Both will use key = "ORD-1" ? same Kafka partition ? ordering preserved.
#
#
# ?????????????????????????????????????????????????????
# 3.3 What the service code looks like
# ?????????????????????????????????????????????????????
#
#   @Service
#   public class OrderService {
#
#       @Autowired
#       private OrderRepository orderRepository;
#
#       @Autowired
#       private OutboxRepository outboxRepository;
#
#       @Transactional    ? DATABASE transaction (NOT Kafka transaction!)
#       public Order createOrder(OrderRequest request) {
#
#           // Step 1: Save the order
#           Order order = new Order();
#           order.setOrderId(UUID.randomUUID().toString());
#           order.setCustomerId(request.getCustomerId());
#           order.setAmount(request.getAmount());
#           order.setStatus("CREATED");
#           orderRepository.save(order);
#
#           // Step 2: Save the event to outbox (SAME transaction!)
#           OutboxEvent event = new OutboxEvent();
#           event.setId(UUID.randomUUID());
#           event.setAggregateType("Order");
#           event.setAggregateId(order.getOrderId());
#           event.setEventType("ORDER_CREATED");
#           event.setPayload(toJson(order));          // serialize to JSON string
#           event.setCreatedAt(Instant.now());
#           event.setPublished(false);
#           outboxRepository.save(event);
#
#           return order;
#       }
#       // If orderRepository.save() fails ? outboxRepository.save() is also rolled back
#       // If outboxRepository.save() fails ? orderRepository.save() is also rolled back
#       // BOTH succeed or BOTH fail. That's the guarantee.
#   }
#
#   KEY POINT: Notice there is NO kafkaTemplate.send() here!
#   The service ONLY writes to the database. It never touches Kafka directly.
#   A separate process handles the Kafka publishing.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 4. APPROACH 1 ? Polling Publisher (Simple, no extra infrastructure)
# ???????????????????????????????????????????????????????????????????????????????
#
# This is the simplest way to implement the outbox pattern.
# A scheduled job polls the outbox table and publishes unpublished events.
#
#
# ?????????????????????????????????????????????????????
# 4.1 How polling works
# ?????????????????????????????????????????????????????
#
#   Every N seconds (say every 1 second):
#     1. SELECT * FROM outbox_events WHERE published = false ORDER BY created_at
#     2. For each row:
#        a) kafkaTemplate.send(topic, key, payload)
#        b) Wait for send confirmation (ack from Kafka)
#        c) UPDATE outbox_events SET published = true, published_at = NOW() WHERE id = ?
#     3. Repeat
#
#   Timeline:
#
#     10:00:00.000  Order created ? outbox row inserted (published=false)
#     10:00:00.500  Poller runs ? finds the row
#     10:00:00.510  Poller sends to Kafka ? success
#     10:00:00.520  Poller updates published=true
#     10:00:01.000  Next poll ? no unpublished rows ? skip
#
#   Latency: events are published within 1 second (the poll interval).
#   For most microservice architectures, this is perfectly acceptable.
#
#
# ?????????????????????????????????????????????????????
# 4.2 The polling publisher code (Spring Boot)
# ?????????????????????????????????????????????????????
#
#   @Component
#   public class OutboxPoller {
#
#       @Autowired
#       private OutboxRepository outboxRepository;
#
#       @Autowired
#       private KafkaTemplate<String, String> kafkaTemplate;
#
#       @Scheduled(fixedRate = 1000)  // every 1 second
#       @Transactional
#       public void pollAndPublish() {
#           // Step 1: Fetch unpublished events
#           List<OutboxEvent> events = outboxRepository
#               .findByPublishedFalseOrderByCreatedAtAsc();
#
#           for (OutboxEvent event : events) {
#               try {
#                   // Step 2: Determine topic from aggregate_type
#                   String topic = event.getAggregateType().toLowerCase() + "-events";
#                   // "Order" ? "order-events"
#
#                   // Step 3: Publish to Kafka
#                   //   Key = aggregate_id (for partition ordering)
#                   //   Value = payload (JSON string)
#                   kafkaTemplate.send(topic, event.getAggregateId(), event.getPayload())
#                       .get();  // .get() blocks until Kafka confirms receipt
#
#                   // Step 4: Mark as published
#                   event.setPublished(true);
#                   event.setPublishedAt(Instant.now());
#                   outboxRepository.save(event);
#
#               } catch (Exception e) {
#                   // Kafka send failed ? don't mark as published
#                   // Next poll will retry this event
#                   log.error("Failed to publish event: " + event.getId(), e);
#                   break;  // stop processing to preserve ordering
#               }
#           }
#       }
#   }
#
#
# ?????????????????????????????????????????????????????
# 4.3 Why break on failure?
# ?????????????????????????????????????????????????????
#
#   In the code above, we do `break` when a send fails. Why?
#
#   Imagine outbox has these events in order:
#     1. ORDER_CREATED  (ORD-1)
#     2. ORDER_UPDATED  (ORD-1)
#     3. ORDER_CANCELLED (ORD-1)
#
#   If event 1 fails to send to Kafka, we MUST NOT send events 2 and 3.
#   Because the consumer would see UPDATE before CREATE ? invalid state.
#
#   By breaking, we ensure:
#     - Events for the same aggregate are published IN ORDER
#     - Failed events block subsequent events (for the same key)
#     - Next poll retry starts from the failed event
#
#   ADVANCED: If you want to skip failed events for one aggregate and
#   continue others, you'd need per-aggregate ordering logic.
#   For most cases, the simple break is sufficient.
#
#
# ?????????????????????????????????????????????????????
# 4.4 Pros and cons of polling
# ?????????????????????????????????????????????????????
#
#   PROS:
#     ? Simple to implement ? just a @Scheduled job
#     ? No extra infrastructure needed
#     ? Easy to understand and debug
#     ? Works with any database
#
#   CONS:
#     ? Polling interval creates LATENCY (1 second delay)
#     ? Continuous database queries even when no new events
#     ? Under high load, polling query can be expensive
#        (SELECT * FROM outbox WHERE published = false on a large table)
#     ? Multiple instances of the app = multiple pollers = DUPLICATE events
#        (unless you use distributed locking or only one poller instance)
#
#
# ?????????????????????????????????????????????????????
# 4.5 Handling multiple instances (distributed locking)
# ?????????????????????????????????????????????????????
#
#   If you run 3 instances of your Order Service, all 3 will poll the outbox.
#   All 3 might pick up the same event and publish it 3 times ? DUPLICATES.
#
#   Solutions:
#
#   Option A: Only ONE instance runs the poller
#     ? Use a config flag: only enable @Scheduled on one instance
#     ? Problem: if that instance dies, no polling happens
#
#   Option B: SELECT ... FOR UPDATE SKIP LOCKED (database-level locking)
#     ? Each poller locks the rows it's processing
#     ? Other pollers skip locked rows
#     ? This is the production-grade approach
#
#     SELECT * FROM outbox_events
#     WHERE published = false
#     ORDER BY created_at
#     LIMIT 100
#     FOR UPDATE SKIP LOCKED;    ? rows are locked, other pollers skip them
#
#   Option C: Use ShedLock (Spring library for distributed scheduling)
#     ? Ensures only one instance runs the scheduled job at a time
#     ? Uses a database table for lock management
#
#     @Scheduled(fixedRate = 1000)
#     @SchedulerLock(name = "outboxPoller", lockAtMostFor = "30s")
#     public void pollAndPublish() { ... }
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 5. APPROACH 2 ? CDC (Change Data Capture) with Debezium
# ???????????????????????????????????????????????????????????????????????????????
#
# CDC is the PRODUCTION-GRADE approach to the outbox pattern.
# Instead of polling the table, a CDC tool reads the DATABASE'S TRANSACTION LOG
# and publishes changes to Kafka automatically.
#
#
# ?????????????????????????????????????????????????????
# 5.1 What is CDC?
# ?????????????????????????????????????????????????????
#
#   Every database has a TRANSACTION LOG (also called WAL ? Write-Ahead Log):
#     PostgreSQL ? WAL (Write-Ahead Log)
#     MySQL      ? Binlog (Binary Log)
#     MongoDB    ? Oplog (Operations Log)
#
#   This log records EVERY change made to the database:
#     INSERT into orders: {orderId: "ORD-1", amount: 500}
#     INSERT into outbox_events: {id: "uuid-1", type: "ORDER_CREATED", ...}
#     UPDATE orders SET status = 'SHIPPED' WHERE orderId = 'ORD-1'
#     DELETE FROM outbox_events WHERE id = 'uuid-1'
#
#   CDC READS this log and converts each change into an event.
#   No polling. No database queries. The database PUSHES changes.

#
#
# ?????????????????????????????????????????????????????
# 5.2 What is Debezium?
# ?????????????????????????????????????????????????????
#
#   Debezium is the most popular open-source CDC tool.
#   It's a Kafka Connect connector that reads database logs
#   and publishes changes as Kafka events.
#
#   Architecture:
#
#   ????????????????      ???????????????????????????      ????????????????
#   ?  PostgreSQL   ?      ?    Kafka Connect         ?      ?    Kafka     ?
#   ?              ?      ?  ?????????????????????   ?      ?              ?
#   ?  WAL (log)?????????????? Debezium Connector?????????????? Topics    ?
#   ?              ?      ?  ?????????????????????   ?      ?              ?
#   ?  orders      ?      ?                          ?      ? order-events ?
#   ?  outbox      ?      ?  Reads WAL, converts     ?      ?              ?
#   ????????????????      ?  to Kafka events          ?      ????????????????
#                         ???????????????????????????
#
#   Debezium connects as a DATABASE REPLICA.
#   It reads the WAL the same way a replica database would.
#   Zero impact on your application code ? it doesn't touch your app.
#
#
# ?????????????????????????????????????????????????????
# 5.3 CDC + Outbox: How they work together
# ?????????????????????????????????????????????????????
#
#   Your service writes to the outbox table (same as before).
#   But instead of a poller reading the table, Debezium reads the WAL.
#
#   Timeline:
#
#     10:00:00.000  @Transactional: save order + save outbox event ? COMMIT
#     10:00:00.001  PostgreSQL writes to WAL: "INSERT into outbox_events ..."
#     10:00:00.005  Debezium reads the WAL entry
#     10:00:00.010  Debezium publishes to Kafka topic "outbox.event.Order"
#
#   Latency: MILLISECONDS (not seconds like polling).
#   No database queries. No polling. WAL is streamed continuously.
#
#
# ?????????????????????????????????????????????????????
# 5.4 Debezium's Outbox Event Router
# ?????????????????????????????????????????????????????
#
#   Debezium has a BUILT-IN feature called the "Outbox Event Router"
#   specifically designed for the outbox pattern.
#
#   Without Outbox Event Router:
#     Debezium captures ALL changes to the outbox_events table
#     and publishes them as generic "table change" events.
#     Topic name: "dbserver1.public.outbox_events"
#     Format: Debezium's own envelope format (includes before/after state)
#
#   With Outbox Event Router (SMT ? Single Message Transform):
#     Debezium ROUTES events to the correct topic based on aggregate_type
#     and flattens the event to just the payload.
#
#     outbox_events row:
#       aggregate_type = "Order"
#       aggregate_id   = "ORD-1"
#       event_type     = "ORDER_CREATED"
#       payload        = {"orderId":"ORD-1","amount":500}
#
#     Debezium publishes to:
#       Topic: "outbox.event.Order"     ? derived from aggregate_type
#       Key:   "ORD-1"                  ? from aggregate_id
#       Value: {"orderId":"ORD-1","amount":500}  ? just the payload
#       Header: event_type = "ORDER_CREATED"
#
#   Configuration in Kafka Connect:
#
#   {
#     "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
#     "database.hostname": "localhost",
#     "database.port": "5432",
#     "database.user": "postgres",
#     "database.password": "postgres",
#     "database.dbname": "orderdb",
#     "table.include.list": "public.outbox_events",
#     "transforms": "outbox",
#     "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
#     "transforms.outbox.table.field.event.key": "aggregate_id",
#     "transforms.outbox.table.field.event.type": "event_type",
#     "transforms.outbox.table.field.event.payload": "payload",
#     "transforms.outbox.route.topic.replacement": "outbox.event.${routedByValue}",
#     "transforms.outbox.table.fields.additional.placement": "event_type:header"
#   }
#
#
# ?????????????????????????????????????????????????????
# 5.5 Polling vs CDC ? Comparison
# ?????????????????????????????????????????????????????
#
#   ?????????????????????????????????????????????????????????????????????????
#   ? Feature              ? Polling               ? CDC (Debezium)         ?
#   ?????????????????????????????????????????????????????????????????????????
#   ? Latency              ? Seconds (poll interval)? Milliseconds           ?
#   ? DB load              ? Continuous queries    ? Near zero (reads WAL)  ?
#   ? Infrastructure       ? None extra            ? Kafka Connect + Debezium?
#   ? Complexity           ? Simple                ? More setup/ops         ?
#   ? Ordering             ? By created_at column  ? By WAL position (exact)?
#   ? Duplicate handling   ? Need locking          ? Built-in (WAL offset)  ?
#   ? Outbox cleanup       ? You manage (DELETE)   ? Debezium can auto-delete?
#   ? Production use       ? Small/medium scale    ? Large scale, Netflix etc?
#   ?????????????????????????????????????????????????????????????????????????
#
#   Rule of thumb:
#     Polling   ? prototype, small team, < 1000 events/second
#     CDC       ? production, high throughput, need millisecond latency
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 6. IDEMPOTENCY ? Why consumers MUST handle duplicates
# ???????????????????????????????????????????????????????????????????????????????
#
# The outbox pattern guarantees "AT LEAST ONCE" delivery, NOT "exactly once."
#
# Duplicates can happen in these scenarios:
#
#   Scenario A (Polling):
#     1. Poller reads event from outbox
#     2. Poller publishes to Kafka ? SUCCESS
#     3. Poller tries to mark as published=true ? DB CONNECTION LOST
#     4. Next poll ? same event is still published=false ? published AGAIN
#     ? Consumer receives the event TWICE
#
#   Scenario B (CDC):
#     1. Debezium reads WAL and publishes to Kafka ? SUCCESS
#     2. Debezium tries to commit its WAL offset ? CRASH
#     3. Debezium restarts ? re-reads from last committed offset
#     ? Consumer receives the event TWICE
#
# HOW to make consumers idempotent:
#
#   Option 1: Use the event ID (from outbox table) to deduplicate
#
#     @KafkaListener(topics = "order-events")
#     public void handleOrder(ConsumerRecord<String, String> record) {
#         String eventId = record.headers().lastHeader("event_id").value();
#
#         // Check if already processed
#         if (processedEventRepository.existsById(eventId)) {
#             log.info("Duplicate event, skipping: " + eventId);
#             return;
#         }
#
#         // Process the event
#         doBusinessLogic(record.value());
#
#         // Mark as processed
#         processedEventRepository.save(new ProcessedEvent(eventId));
#     }
#
#   Option 2: Make the business logic itself idempotent
#
#     // Instead of: balance += amount (NOT idempotent ? adds twice on duplicate)
#     // Use:        balance = computeFromAllTransactions() (idempotent ? same result)
#
#     // Or use database constraints:
#     // INSERT INTO payments (order_id, amount) VALUES (?, ?)
#     // ON CONFLICT (order_id) DO NOTHING;   ? second insert is silently skipped
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 7. OUTBOX CLEANUP ? Retention & Housekeeping
# ???????????????????????????????????????????????????????????????????????????????
#
# The outbox table will grow FOREVER if you don't clean it up.
# Once an event is published, the row has served its purpose.
#
#
# ?????????????????????????????????????????????????????
# 7.1 When can you delete an outbox row?
# ?????????????????????????????????????????????????????
#
#   ONLY after the event has been successfully published to Kafka.
#
#   For Polling:
#     published = true AND published_at < NOW() - INTERVAL '7 days'
#     ? Keep published rows for a few days for debugging, then delete.
#
#   For CDC (Debezium):
#     Debezium reads the INSERT from WAL ? publishes to Kafka.
#     After that, Debezium doesn't need the row anymore.
#     You can DELETE the row immediately or after a retention period.
#
#     IMPORTANT: With CDC, Debezium reads from the WAL, NOT the table.
#     So deleting the row from the table does NOT affect Debezium.
#     The WAL already has the INSERT recorded ? that's all Debezium needs.
#
#
# ?????????????????????????????????????????????????????
# 7.2 Cleanup strategies
# ?????????????????????????????????????????????????????
#
#   Strategy A: Scheduled DELETE (simple)
#
#     @Scheduled(cron = "0 0 2 * * *")  // every day at 2 AM
#     public void cleanupOutbox() {
#         outboxRepository.deleteByPublishedTrueAndPublishedAtBefore(
#             Instant.now().minus(7, ChronoUnit.DAYS)
#         );
#     }
#
#   Strategy B: Database partitioning (production-grade)
#
#     Partition the outbox table by created_at (e.g., daily partitions).
#     Drop old partitions instead of DELETE ? instant, no table locks.
#
#     CREATE TABLE outbox_events (
#         ...
#     ) PARTITION BY RANGE (created_at);
#
#     -- Create daily partitions
#     CREATE TABLE outbox_events_2024_01_15
#         PARTITION OF outbox_events
#         FOR VALUES FROM ('2024-01-15') TO ('2024-01-16');
#
#     -- Drop old partition (instant, no row-by-row delete)
#     DROP TABLE outbox_events_2024_01_08;
#
#   Strategy C: CDC auto-delete (Debezium feature)
#
#     Debezium's Outbox Event Router has a config option:
#       "transforms.outbox.table.expand.json.payload": "true"
#
#     Combined with a "delete.handling.mode" config, Debezium can
#     signal that it's done with a row, allowing auto-cleanup.
#     In practice, most teams use Strategy A or B alongside CDC.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 8. EDGE CASES & PRODUCTION CONSIDERATIONS
# ???????????????????????????????????????????????????????????????????????????????
#
#
# ?????????????????????????????????????????????????????
# 8.1 Ordering of events
# ?????????????????????????????????????????????????????
#
#   The outbox pattern preserves ordering PER AGGREGATE (per entity).
#
#   Why? Because:
#     - Events for the same aggregate_id go to the SAME Kafka partition
#       (aggregate_id is used as the Kafka message key)
#     - Kafka guarantees ordering within a partition
#
#   So for Order ORD-1:
#     ORDER_CREATED  ? partition 3
#     ORDER_UPDATED  ? partition 3  (same key = same partition)
#     ORDER_CANCELLED? partition 3
#     ? Consumer reads them in order: CREATED, UPDATED, CANCELLED ?
#
#   But across DIFFERENT aggregates, no ordering guarantee:
#     ORD-1 CREATED  ? partition 3
#     ORD-2 CREATED  ? partition 7
#     ? These are independent. ORD-2 might be consumed before ORD-1.
#     ? This is fine! They are separate entities. No ordering needed.
#
#
# ?????????????????????????????????????????????????????
# 8.2 Performance under high load
# ?????????????????????????????????????????????????????
#
#   Problem: Writing to outbox_events on EVERY business operation adds
#   an extra INSERT to every transaction. Is this expensive?
#
#   Answer: Not really. The outbox row is:
#     - A simple INSERT (no complex queries)
#     - In the SAME transaction (no extra round trip)
#     - Into an append-only table (fast writes)
#
#   But at very high scale (10,000+ events/second):
#     - Use batch INSERTs for multiple events in one transaction
#     - Partition the outbox table by date
#     - Index only on (published, created_at) ? nothing else
#     - With CDC, cleanup rows aggressively since Debezium reads WAL
#
#
# ?????????????????????????????????????????????????????
# 8.3 What if Kafka is down?
# ?????????????????????????????????????????????????????
#
#   This is the BEAUTY of the outbox pattern.
#
#   If Kafka is down:
#     - Your business operations CONTINUE normally
#     - Orders are saved to DB ?
#     - Outbox events are saved to DB ?
#     - Poller tries to publish ? fails ? events stay as published=false
#     - When Kafka comes back ? poller catches up and publishes all pending events
#
#   Compare with direct kafkaTemplate.send():
#     - If Kafka is down ? your @Transactional method fails
#     - The entire transaction rolls back
#     - Order is NOT saved ? customer sees an error
#     - Your service is DOWN even though the database is healthy
#
#   The outbox pattern DECOUPLES your service availability from Kafka's availability.
#
#
# ?????????????????????????????????????????????????????
# 8.4 Schema evolution of outbox events
# ?????????????????????????????????????????????????????
#
#   Over time, your event payload will change:
#     v1: {"orderId":"ORD-1","amount":500}
#     v2: {"orderId":"ORD-1","amount":500,"currency":"INR"}
#     v3: {"orderId":"ORD-1","amount":500,"currency":"INR","items":[...]}
#
#   ALWAYS add fields, NEVER remove or rename.
#   This ensures backward compatibility ? old consumers can still read new events.
#
#   Store the payload as a JSON string (TEXT/JSONB column).
#   Don't use rigid column-per-field schemas for the outbox event data.
#   The payload column is your flexible envelope.
#
#
# ?????????????????????????????????????????????????????
# 8.5 Multiple aggregate types in one outbox table
# ?????????????????????????????????????????????????????
#
#   Should you have one outbox table per entity or one shared table?
#
#   RECOMMENDATION: ONE shared outbox_events table.
#
#   Why? Because:
#     - The aggregate_type column differentiates entities
#     - Less tables to manage
#     - Same poller/CDC setup works for all entity types
#     - Debezium's Outbox Event Router handles routing automatically
#
#   The aggregate_type field routes to the correct Kafka topic:
#     aggregate_type = "Order"    ? topic: "outbox.event.Order"
#     aggregate_type = "Payment"  ? topic: "outbox.event.Payment"
#     aggregate_type = "Shipment" ? topic: "outbox.event.Shipment"
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 9. SUMMARY ? The Outbox Pattern at a Glance
# ???????????????????????????????????????????????????????????????????????????????
#
#
# ?????????????????????????????????????????????????????
# 9.1 One-glance summary table
# ?????????????????????????????????????????????????????
#
#   ???????????????????????????????????????????????????????????????????????????
#   ? Concept              ? What it means                                    ?
#   ???????????????????????????????????????????????????????????????????????????
#   ? Problem              ? Dual-write: DB + Kafka can go out of sync       ?
#   ? Solution             ? Write event to DB outbox table in same txn      ?
#   ? Outbox table         ? id, aggregate_type, aggregate_id, event_type,   ?
#   ?                      ? payload, published, created_at                  ?
#   ? Approach 1: Polling  ? @Scheduled job reads unpublished rows ? Kafka   ?
#   ? Approach 2: CDC      ? Debezium reads WAL ? Kafka (millisecond delay)  ?
#   ? Idempotency          ? Consumers MUST handle duplicates (event_id)     ?
#   ? Cleanup              ? Delete published rows after retention period    ?
#   ? Ordering             ? Per-aggregate ordering via Kafka partition key  ?
#   ? Kafka down?          ? Events queue in outbox ? published when back    ?
#   ???????????????????????????????????????????????????????????????????????????
#
#
# ?????????????????????????????????????????????????????
# 9.2 The big picture ? How everything connects
# ?????????????????????????????????????????????????????
#
#   ???????????????????????????????????????????????????????????????????????
#   ?                        ORDER SERVICE                                ?
#   ?                                                                     ?
#   ?   POST /orders                                                      ?
#   ?     ?                                                               ?
#   ?     ?                                                               ?
#   ?   @Transactional {                                                  ?
#   ?     1. orderRepository.save(order);      ??                         ?
#   ?     2. outboxRepository.save(outboxEvent); ??? SAME DB TRANSACTION  ?
#   ?   }                                      ??                         ?
#   ?                                                                     ?
#   ???????????????????????????????????????????????????????????????????????
#                          ?
#              ?????????????????????????
#              ?                       ?
#         Option A               Option B
#         POLLING                  CDC
#              ?                       ?
#     ???????????????????    ?????????????????????
#     ? @Scheduled       ?    ? Debezium reads WAL ?
#     ? SELECT unpublished?    ? (no app queries)   ?
#     ? ? send to Kafka  ?    ? ? send to Kafka    ?
#     ???????????????????    ?????????????????????
#              ?                       ?
#              ?????????????????????????
#                          ?
#                          ?
#                    ?????????????
#                    ?   KAFKA   ?
#                    ?  TOPIC    ?
#                    ?????????????
#                          ?
#                          ?
#                ????????????????????
#                ? CONSUMER SERVICE ?
#                ?                  ?
#                ? 1. Check eventId ?
#                ?    (idempotency) ?
#                ? 2. Process event ?
#                ? 3. Save eventId  ?
#                ????????????????????
#
#
# ?????????????????????????????????????????????????????
# 9.3 When to use the outbox pattern
# ?????????????????????????????????????????????????????
#
#   USE IT when:
#     ? You need to write to a database AND publish to Kafka
#     ? Data consistency between services matters
#     ? You can't afford lost or phantom events
#     ? You want your service to work even when Kafka is down
#
#   DON'T NEED IT when:
#     ? You're only writing to Kafka (no database involved)
#     ? Eventual consistency with occasional data loss is acceptable
#     ? You're doing Kafka-to-Kafka processing (use Kafka Transactions)
#
#
# ???????????????????????????????????????????????????????????????????????????????
