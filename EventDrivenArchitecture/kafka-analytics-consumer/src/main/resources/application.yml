server:
  port: 8083

spring:
  application:
    name: kafka-analytics-consumer
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-service-group  # Different consumer group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true  # Auto-commit for simplicity in analytics
      auto-commit-interval: 5000  # Commit every 5 seconds
      max-poll-records: 500  # Fetch more records for batch processing
      properties:
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000

# Kafka Topics Configuration
kafka:
  topics:
    order-events: order-events

# Logging
logging:
  level:
    com.eda.analytics: DEBUG
    org.apache.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

