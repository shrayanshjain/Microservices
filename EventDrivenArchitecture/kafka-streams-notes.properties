# ???????????????????????????????????????????????????????????????????????????????
# ?         KAFKA STREAMS ? COMPLETE SENIOR-LEVEL NOTES                       ?
# ?                    Part 1: In-Depth Explanation                            ?
# ???????????????????????????????????????????????????????????????????????????????
# ?  Covers: The Problem, What is Streams, Topology, KStream vs KTable,      ?
# ?          Stateless ops, Stateful ops, Windowing, Joins, State Stores,     ?
# ?          Threading model, Exactly-once, Interactive Queries               ?
# ???????????????????????????????????????????????????????????????????????????????
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 1. THE PROBLEM ? Why Do We Need Kafka Streams?
# ???????????????????????????????????????????????????????????????????????????????
#
# We've built:
#   - Producer ? sends Order events to Kafka
#   - Consumer ? reads Order events, processes them
#   - Schema Registry ? contract enforcement with Avro
#
# This works for SIMPLE use cases:
#   "Read an order ? send notification ? done"
#
# But what about these REAL-WORLD requirements?
#
#
# ?????????????????????????????????????????????????
# SCENARIO 1: Real-time aggregation
# ?????????????????????????????????????????????????
#
#   "Show me total revenue PER CUSTOMER in real-time"
#
#   With plain consumer:
#     - Read each order event
#     - Maintain a HashMap<customerId, totalRevenue> in memory
#     - On each event: map.put(customerId, map.get(customerId) + totalAmount)
#
#   PROBLEMS:
#     ? App crashes ? HashMap is GONE ? start from offset 0? Replay millions?
#     ? Multiple instances? Each has PARTIAL data (different partitions)
#     ? How to query this data? No API, it's just a local variable
#     ? Rebalance happens ? partition moves to another instance ? data lost
#
#
# ?????????????????????????????????????????????????
# SCENARIO 2: Stream enrichment (join two topics)
# ?????????????????????????????????????????????????
#
#   "Join order-events with customer-profile topic to get customer name + email"
#
#   With plain consumer:
#     - Consumer A reads order-events
#     - Consumer B reads customer-profiles
#     - Store customer data in HashMap
#     - When order arrives, look up customer from HashMap
#
#   PROBLEMS:
#     ? Two consumers, manual coordination
#     ? Race condition: order arrives BEFORE customer profile is loaded
#     ? Customer profile updates mid-stream ? stale data
#     ? HashMap lost on crash
#
#
# ?????????????????????????????????????????????????
# SCENARIO 3: Windowed operations
# ?????????????????????????????????????????????????
#
#   "Count orders per product in the LAST 5 MINUTES"
#
#   With plain consumer:
#     - Track timestamps manually
#     - Expire old entries manually
#     - Handle late-arriving events manually
#     - Multiple instances ? each sees partial window
#
#   PROBLEMS:
#     ? Extremely complex manual time management
#     ? What if an event arrives 10 seconds late? Which window?
#     ? Crash recovery ? which window state was where?
#
#
# ?????????????????????????????????????????????????
# THE ROOT CAUSE:
# ?????????????????????????????????????????????????
#
#   The Consumer API is for READING and PROCESSING individual messages.
#   It has NO built-in support for:
#     - Maintaining STATE across messages (aggregations, counts)
#     - JOINING data across topics
#     - TIME-BASED operations (windows, expiry)
#     - FAULT-TOLERANT state (survives crashes)
#     - SCALABLE state (across multiple instances)
#
#   You CAN build all of this manually. But you're essentially building
#   a stream processing framework from scratch. That's what Kafka Streams IS.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 2. WHAT IS KAFKA STREAMS? ? The Big Picture
# ???????????????????????????????????????????????????????????????????????????????
#
# Kafka Streams is a CLIENT LIBRARY for processing data stored in Kafka.
#
# KEY INSIGHT: It is NOT a separate cluster or service.
#              It is a JAR file you add to your Spring Boot application.
#
#   ??????????????????????????????????????????????????????????????????????
#   ?                    COMPARISON                                      ?
#   ??????????????????????????????????????????????????????????????????????
#   ? Apache Spark        ? Separate cluster (YARN/Mesos/K8s)           ?
#   ? Apache Flink        ? Separate cluster (JobManager + TaskManagers)?
#   ? Apache Storm        ? Separate cluster (Nimbus + Supervisors)     ?
#   ? KAFKA STREAMS       ? Just a library. Runs in YOUR app. No cluster?
#   ??????????????????????????????????????????????????????????????????????
#
#   Your Spring Boot app:
#     ???????????????????????????????????????????
#     ?  order-analytics-service                 ?
#     ?  ???????????????????????????????         ?
#     ?  ?  Your business logic        ?         ?
#     ?  ?  (controllers, services)    ?         ?
#     ?  ???????????????????????????????         ?
#     ?  ???????????????????????????????         ?
#     ?  ?  Kafka Streams library      ?         ? ? just a dependency
#     ?  ?  (kafka-streams JAR)        ?         ?
#     ?  ???????????????????????????????         ?
#     ?  ???????????????????????????????         ?
#     ?  ?  Spring Kafka               ?         ?
#     ?  ?  (spring-kafka JAR)         ?         ?
#     ?  ???????????????????????????????         ?
#     ???????????????????????????????????????????
#
# Kafka Streams gives you:
#   ? Stateful processing (aggregations, joins) with FAULT-TOLERANT state
#   ? Exactly-once processing (built-in, not manual)
#   ? Time-based windowing (tumbling, hopping, sliding, session)
#   ? Stream-table joins (enrich events with reference data)
#   ? Scalability (just start more instances of your app)
#   ? No separate cluster needed
#
# Think of it as:
#   "Consumer API gives you a message. Streams API gives you a PIPELINE."
#
#
# ?????????????????????????????????????????????????
# 2.1 Consumer API vs Streams API ? Side by Side
# ?????????????????????????????????????????????????
#
#   CONSUMER API (what we've been using):
#     @KafkaListener(topics = "order-events")
#     public void listen(Order order) {
#         // process ONE message
#         // you manage state manually
#         // you manage offsets
#         // you manage error handling
#     }
#
#   STREAMS API (what we're learning now):
#     KStream<String, Order> orders = builder.stream("order-events");
#     orders
#         .filter((key, order) -> order.getTotalAmount() > 100)
#         .groupByKey()
#         .count()
#         .toStream()
#         .to("high-value-order-counts");
#
#   ? Declarative. You describe WHAT to do, not HOW.
#   ? The framework handles state, fault-tolerance, scaling, offsets.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 3. TOPOLOGY ? The Heart of Kafka Streams
# ???????????????????????????????????????????????????????????????????????????????
#
# A Topology is a DIRECTED ACYCLIC GRAPH (DAG) of processing steps.
#
# Every Kafka Streams application defines a topology:
#   "Read from THIS topic ? do THIS ? do THAT ? write to THAT topic"
#
# Think of it like a PIPELINE in a factory:
#
#   Raw material ? Cut ? Shape ? Paint ? Package ? Ship
#   (source)       (processor) (processor)          (sink)
#
# In Kafka Streams:
#
#   Source Topic ? Filter ? Map ? Aggregate ? Sink Topic
#   (source)      (processor)                  (sink)
#
#
# ?????????????????????????????????????????????????
# 3.1 THREE types of nodes in a topology
# ?????????????????????????????????????????????????
#
#   ??????????????????????????????????????????????????????????????????????
#   ? Node Type       ? What it does                                    ?
#   ?????????????????????????????????????????????????????????????????????
#   ? SOURCE node     ? Reads from a Kafka topic                       ?
#   ?                 ? Entry point of data into the topology          ?
#   ?                 ? Example: builder.stream("order-events")        ?
#   ?????????????????????????????????????????????????????????????????????
#   ? PROCESSOR node  ? Transforms, filters, aggregates data           ?
#   ?                 ? The "business logic" steps                     ?
#   ?                 ? Example: .filter(), .map(), .groupBy(), .count()?
#   ?????????????????????????????????????????????????????????????????????
#   ? SINK node       ? Writes results to a Kafka topic                ?
#   ?                 ? Exit point of data from the topology           ?
#   ?                 ? Example: .to("output-topic")                   ?
#   ?????????????????????????????????????????????????????????????????????
#
#
# ?????????????????????????????????????????????????
# 3.2 EXAMPLE TOPOLOGY ? Visual
# ?????????????????????????????????????????????????
#
#   Use case: "Filter high-value orders, count per customer, write results"
#
#   ???????????????????
#   ?  order-events    ?   ? SOURCE (Kafka topic)
#   ?  (source topic)  ?
#   ????????????????????
#            ?
#            ?
#   ???????????????????
#   ?    FILTER        ?   ? PROCESSOR: totalAmount > 100
#   ? (amount > 100)   ?
#   ????????????????????
#            ?
#            ?
#   ???????????????????
#   ?    GROUP BY      ?   ? PROCESSOR: group by customerId (key)
#   ?  (customerId)    ?
#   ????????????????????
#            ?
#            ?
#   ???????????????????
#   ?    COUNT         ?   ? PROCESSOR: count per group (STATEFUL!)
#   ?  (per customer)  ?         ? reads/writes state store
#   ????????????????????
#            ?
#            ?
#   ???????????????????
#   ?  customer-order  ?   ? SINK (output Kafka topic)
#   ?  -counts         ?
#   ???????????????????
#
#
# In code, this topology is:
#
#   StreamsBuilder builder = new StreamsBuilder();
#
#   builder.stream("order-events")                        // SOURCE
#       .filter((key, order) -> order.getTotalAmount() > 100)  // PROCESSOR
#       .groupByKey()                                     // PROCESSOR
#       .count(Materialized.as("order-counts-store"))     // PROCESSOR (stateful)
#       .toStream()                                       // convert KTable ? KStream
#       .to("customer-order-counts");                     // SINK
#
#   KafkaStreams streams = new KafkaStreams(builder.build(), config);
#   streams.start();
#
#
# IMPORTANT:
#   - A topology is DEFINED once at startup
#   - It CANNOT be changed while the app is running
#   - It runs CONTINUOUSLY ? not a batch job, it's always running
#   - It processes events AS THEY ARRIVE (real-time)
#   - builder.build() creates the topology object
#   - streams.start() starts the processing threads

#
#
# ???????????????????????????????????????????????????????????????????????????????
# 4. KStream vs KTable vs GlobalKTable ? The Three Abstractions
# ???????????????????????????????????????????????????????????????????????????????
#
# This is THE most important concept in Kafka Streams.
# Everything else builds on understanding these three.
#
#
# ?????????????????????????????????????????????????????
# 4.1 KStream ? An infinite stream of EVENTS
# ?????????????????????????????????????????????????????
#
#   A KStream represents an UNBOUNDED sequence of events.
#   Each record is an INDEPENDENT FACT ? something that happened.
#
#   Think of it like a LOG:
#     "Order O-1 was placed at 10:00"
#     "Order O-2 was placed at 10:01"
#     "Order O-1 was UPDATED at 10:05"    ? this is a NEW event, NOT a replacement
#     "Order O-3 was placed at 10:06"
#
#   KEY PROPERTY: Records with the SAME KEY are NOT related.
#                 Each record is a standalone event.
#
#   In Kafka terms:
#     KStream ? a Kafka topic where every record matters
#     Every message is an INSERT (append-only)
#
#   Example:
#     Topic: order-events
#     offset 0: key=O-1, value={orderId: O-1, status: CREATED}
#     offset 1: key=O-2, value={orderId: O-2, status: CREATED}
#     offset 2: key=O-1, value={orderId: O-1, status: SHIPPED}   ? NOT an update to offset 0!
#     offset 3: key=O-1, value={orderId: O-1, status: DELIVERED}  ? NOT an update to offset 2!
#
#   KStream sees ALL FOUR records. Nothing is replaced or overwritten.
#   It's a HISTORY of everything that happened.
#
#   Code:
#     KStream<String, Order> orderStream = builder.stream("order-events");
#     // orderStream will emit: O-1/CREATED, O-2/CREATED, O-1/SHIPPED, O-1/DELIVERED
#
#   Real-world analogy:
#     KStream = bank TRANSACTION HISTORY
#     "Deposited $100" ? "Withdrew $50" ? "Deposited $200" ? "Withdrew $25"
#     Every transaction matters. You can't skip any. They ALL happened.
#
#
# ?????????????????????????????????????????????????????
# 4.2 KTable ? A CHANGELOG of state
# ?????????????????????????????????????????????????????
#
#   A KTable represents the LATEST STATE per key.
#   Each new record with the same key REPLACES the previous one.
#
#   Think of it like a DATABASE TABLE:
#     key=O-1 ? {status: CREATED}     ? row inserted
#     key=O-2 ? {status: CREATED}     ? another row
#     key=O-1 ? {status: SHIPPED}     ? O-1 row is UPDATED (overwritten)
#     key=O-1 ? {status: DELIVERED}   ? O-1 row is UPDATED again
#
#   After processing all records:
#     ??????????????????????????????????????????
#     ? Key     ? Current Value                ?
#     ??????????????????????????????????????????
#     ? O-1     ? {status: DELIVERED}          ?  ? only latest
#     ? O-2     ? {status: CREATED}            ?
#     ??????????????????????????????????????????
#
#   KTable sees ONLY the latest value per key.
#   It maintains STATE ? like a materialized view in SQL.
#
#   Code:
#     KTable<String, Order> orderTable = builder.table("order-events");
#     // orderTable at any point shows: O-1=DELIVERED, O-2=CREATED
#
#   Real-world analogy:
#     KTable = bank ACCOUNT BALANCE
#     You don't see the transaction history.
#     You see: "Account A has $225" (current state).
#
#
# ?????????????????????????????????????????????????????
# 4.3 KStream vs KTable ? The Critical Difference
# ?????????????????????????????????????????????????????
#
#   Same data, DIFFERENT interpretation:
#
#   Topic: order-events (4 records)
#     offset 0: key=O-1, value=CREATED
#     offset 1: key=O-2, value=CREATED
#     offset 2: key=O-1, value=SHIPPED
#     offset 3: key=O-1, value=DELIVERED
#
#   Read as KStream (builder.stream()):
#     ? 4 records processed:
#       O-1/CREATED, O-2/CREATED, O-1/SHIPPED, O-1/DELIVERED
#     ? "Tell me EVERYTHING that happened"
#
#   Read as KTable (builder.table()):
#     ? 2 records in final state:
#       O-1/DELIVERED, O-2/CREATED
#     ? "Tell me the CURRENT STATE of each entity"
#
#   ?????????????????????????????????????????????????????????????????????
#   ?                     ? KStream               ? KTable              ?
#   ?????????????????????????????????????????????????????????????????????
#   ? Each record is      ? An event (fact)       ? An update (upsert)  ?
#   ? Same key means      ? Another event         ? Replace previous    ?
#   ? null value means    ? Record with no value  ? DELETE the key      ?
#   ? Backed by           ? Log (append-only)     ? Changelog + state   ?
#   ? Analogy             ? Transaction history   ? Account balance     ?
#   ? SQL equivalent      ? INSERT                ? UPSERT              ?
#   ? Use when            ? Every event matters   ? Only latest matters ?
#   ?????????????????????????????????????????????????????????????????????
#
#   CRITICAL DETAIL ? null value in KTable = TOMBSTONE = DELETE:
#     key=O-1, value=null  ? O-1 is DELETED from the KTable
#     This is how you remove entries from a KTable.
#     In KStream, null value is just a record with no value (still processed).
#
#
# ?????????????????????????????????????????????????????
# 4.4 GlobalKTable ? The FULL picture on every instance
# ?????????????????????????????????????????????????????
#
#   Before GlobalKTable, you need to understand a PROBLEM with KTable:
#
#   KTable is PARTITIONED. Each instance of your app only has
#   the data for the partitions assigned to it.
#
#   Example: customer-profiles topic has 3 partitions
#
#     Instance 1 (partitions 0,1):
#       KTable has: customer-A, customer-B, customer-D
#
#     Instance 2 (partition 2):
#       KTable has: customer-C, customer-E
#
#   Now you want to JOIN order-events with customer-profiles:
#     Order for customer-C arrives at Instance 1
#     ? Instance 1 looks up customer-C in its KTable
#     ? NOT FOUND! Customer-C is on Instance 2!
#     ? JOIN FAILS ?
#
#   This only works if the ORDER and CUSTOMER are on the SAME partition
#   (co-partitioned ? same key, same number of partitions).
#
#
#   GlobalKTable SOLVES this:
#     - Every instance gets ALL partitions of the topic
#     - Full copy of the data on EVERY instance
#
#     Instance 1:
#       GlobalKTable has: customer-A, B, C, D, E   ? ALL customers
#
#     Instance 2:
#       GlobalKTable has: customer-A, B, C, D, E   ? ALL customers (same)
#
#     Now: Order for customer-C arrives at Instance 1
#     ? Instance 1 looks up customer-C ? FOUND! ?
#     ? JOIN WORKS regardless of partitioning
#
#
#   Code:
#     GlobalKTable<String, Customer> customers =
#         builder.globalTable("customer-profiles");
#
#
#   ?????????????????????????????????????????????????????????????????????????
#   ?                     ? KTable               ? GlobalKTable             ?
#   ?????????????????????????????????????????????????????????????????????????
#   ? Data per instance   ? Only assigned         ? ALL partitions           ?
#   ?                     ? partitions            ? (full copy)              ?
#   ? Co-partitioning     ? REQUIRED for joins   ? NOT required             ?
#   ? Memory usage        ? Lower (partial data) ? Higher (full data)       ?
#   ? Use case            ? Large reference data ? Small reference data     ?
#   ?                     ? (millions of rows)   ? (thousands of rows)      ?
#   ? Topic updates       ? Only assigned         ? All partitions consumed  ?
#   ?                     ? partitions consumed   ?                          ?
#   ? Example             ? user-transactions    ? country-codes            ?
#   ?                     ? (too big to copy)    ? (small, needs everywhere)?
#   ?????????????????????????????????????????????????????????????????????????
#
#   WHEN to use GlobalKTable:
#     ? Small reference/lookup data (countries, currencies, configs)
#     ? When you need to join with a topic that has different partitioning
#     ? NOT for large datasets (it copies EVERYTHING to every instance)
#     ? NOT for frequently changing data (every instance must process every update)
#
#
# ?????????????????????????????????????????????????????
# 4.5 How does KTable ACTUALLY work? ? The Changelog
# ?????????????????????????????????????????????????????
#
#   KTable is NOT magic. Under the hood:
#
#   1. KTable reads from a topic (just like KStream does)
#   2. It reads EVERY record (not just latest)
#   3. But it maintains STATE: an internal key-value store
#   4. For each record: store.put(key, value)  ? overwriting previous
#
#   So it processes the same records as KStream, but the RESULT is different:
#
#     offset 0: key=O-1, value=CREATED   ? store: {O-1: CREATED}
#     offset 1: key=O-2, value=CREATED   ? store: {O-1: CREATED, O-2: CREATED}
#     offset 2: key=O-1, value=SHIPPED   ? store: {O-1: SHIPPED, O-2: CREATED}
#     offset 3: key=O-1, value=DELIVERED ? store: {O-1: DELIVERED, O-2: CREATED}
#
#   The state store is backed by RocksDB (local disk) by default.
#   It's also backed up to a Kafka changelog topic for fault tolerance.
#
#   If Instance 1 crashes:
#     ? Instance 2 takes over its partitions
#     ? Instance 2 rebuilds the state by replaying the changelog topic
#     ? No data loss!
#
#   Changelog topic name: <application.id>-<store-name>-changelog
#   Example: order-analytics-order-counts-store-changelog
#
#   This changelog topic is a COMPACTED topic:
#     - Kafka keeps only the LATEST value per key
#     - Old values are deleted during log compaction
#     - This keeps the changelog small and recovery fast
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 5. STATELESS OPERATIONS ? No memory needed
# ???????????????????????????????????????????????????????????????????????????????
#
# Stateless = each record is processed INDEPENDENTLY.
# No need to "remember" anything from previous records.
# The output depends ONLY on the current input record.
#
#
# ?????????????????????????????????????????????????????
# 5.1 filter() ? Keep records that match a condition
# ?????????????????????????????????????????????????????
#
#   KStream<String, Order> highValueOrders = orderStream
#       .filter((key, order) -> order.getTotalAmount() > 100);
#
#   Input:   O-1/$50, O-2/$200, O-3/$75, O-4/$500
#   Output:  O-2/$200, O-4/$500
#
#   The opposite: filterNot() ? keep records that DON'T match
#     KStream<String, Order> lowValueOrders = orderStream
#         .filterNot((key, order) -> order.getTotalAmount() > 100);
#     Output: O-1/$50, O-3/$75
#
#
# ?????????????????????????????????????????????????????
# 5.2 map() / mapValues() ? Transform records
# ?????????????????????????????????????????????????????
#
#   mapValues() ? change ONLY the value, keep the key
#     KStream<String, String> statuses = orderStream
#         .mapValues(order -> order.getStatus());
#
#     Input:   key=O-1, value={orderId:O-1, status:CREATED, amount:200}
#     Output:  key=O-1, value="CREATED"
#
#   map() ? change BOTH key and value
#     KStream<String, Double> byCustomer = orderStream
#         .map((key, order) -> KeyValue.pair(
#             order.getCustomerId(),     // new key
#             order.getTotalAmount()     // new value
#         ));
#
#     Input:   key=O-1, value={customerId:C-1, amount:200}
#     Output:  key=C-1, value=200.0
#
#   ?? WARNING: map() changes the key ? this causes REPARTITIONING!
#     When you change the key, Kafka Streams MUST send the record to a
#     different partition (because partitioning is based on key).
#     This creates an internal repartition topic.
#     mapValues() does NOT cause repartitioning (key unchanged).
#     ? PREFER mapValues() when you only need to change the value.
#
#
# ?????????????????????????????????????????????????????
# 5.3 flatMap() / flatMapValues() ? One input ? many outputs
# ?????????????????????????????????????????????????????
#
#   flatMapValues() ? one record becomes MULTIPLE records
#     KStream<String, String> words = sentenceStream
#         .flatMapValues(sentence -> Arrays.asList(sentence.split(" ")));
#
#     Input:   key=1, value="hello world"
#     Output:  key=1, value="hello"
#              key=1, value="world"
#
#   This is the basis of WordCount ? the "Hello World" of stream processing.
#
#
# ?????????????????????????????????????????????????????
# 5.4 selectKey() ? Change ONLY the key
# ?????????????????????????????????????????????????????
#
#   KStream<String, Order> reKeyed = orderStream
#       .selectKey((key, order) -> order.getCustomerId());
#
#   Input:   key=O-1, value={customerId:C-1, ...}
#   Output:  key=C-1, value={customerId:C-1, ...}
#
#   ?? This also causes REPARTITIONING (key changed).
#
#
# ?????????????????????????????????????????????????????
# 5.5 branch() ? Split one stream into multiple
# ?????????????????????????????????????????????????????
#
#   Map<String, KStream<String, Order>> branches = orderStream
#       .split(Named.as("order-"))
#       .branch((key, order) -> order.getTotalAmount() > 1000,
#               Branched.as("premium"))
#       .branch((key, order) -> order.getTotalAmount() > 100,
#               Branched.as("standard"))
#       .defaultBranch(Branched.as("budget"));
#
#   KStream<String, Order> premium  = branches.get("order-premium");
#   KStream<String, Order> standard = branches.get("order-standard");
#   KStream<String, Order> budget   = branches.get("order-budget");
#
#   One input stream ? three output streams based on conditions.
#
#
# ?????????????????????????????????????????????????????
# 5.6 peek() ? Side effect without changing the stream
# ?????????????????????????????????????????????????????
#
#   orderStream
#       .peek((key, order) -> log.info("Processing: {}", order))
#       .filter(...)
#       .mapValues(...)
#
#   peek() lets you inspect records (logging, metrics) without modifying them.
#   The stream continues unchanged after peek().
#
#
# ?????????????????????????????????????????????????????
# 5.7 merge() ? Combine two streams into one
# ?????????????????????????????????????????????????????
#
#   KStream<String, Order> allOrders = onlineOrders.merge(storeOrders);
#
#   Two input streams ? one output stream.
#   Records are interleaved (not sorted).
#
#
# ?????????????????????????????????????????????????????
# 5.8 Repartitioning ? Why it matters
# ?????????????????????????????????????????????????????
#
#   When you change the key (map, selectKey, flatMap), Kafka Streams
#   MUST repartition the data:
#
#   BEFORE key change:  key=orderId ? partition based on orderId
#   AFTER key change:   key=customerId ? need partition based on customerId
#
#   Kafka Streams automatically:
#     1. Creates an internal repartition topic: <app-id>-KSTREAM-MAP-xxxxx-repartition
#     2. Sends records to the repartition topic (with new key)
#     3. Reads from repartition topic (now correctly partitioned)
#
#   This means:
#     - Extra network I/O (write to Kafka + read back)
#     - Extra latency
#     - Extra storage (repartition topic in Kafka)
#
#   ? That's why mapValues() is preferred over map() when possible.
#   ? mapValues() does NOT change the key ? no repartitioning needed.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 6. STATEFUL OPERATIONS ? Remembering across records
# ???????????????????????????????????????????????????????????????????????????????
#
# Stateful = the output depends on PREVIOUS records, not just the current one.
# The processor must REMEMBER (maintain state) to produce results.
#
# ALL stateful operations require:
#   1. A KEY (to group records ? groupByKey or groupBy)
#   2. A STATE STORE (to persist the accumulated state)
#
# Stateful operations ALWAYS produce a KTable (not a KStream).
# Why? Because the result is an EVOLVING value per key, not individual events.
#
#
# ?????????????????????????????????????????????????????
# 6.1 groupByKey() + count() ? Count records per key
# ?????????????????????????????????????????????????????
#
#   KTable<String, Long> orderCounts = orderStream
#       .groupByKey()                                    // group by existing key
#       .count(Materialized.as("order-counts-store"));   // count per group
#
#   Input stream:
#     key=C-1, value=Order1
#     key=C-2, value=Order2
#     key=C-1, value=Order3
#     key=C-1, value=Order4
#
#   KTable state evolves:
#     After record 1: {C-1: 1}
#     After record 2: {C-1: 1, C-2: 1}
#     After record 3: {C-1: 2, C-2: 1}
#     After record 4: {C-1: 3, C-2: 1}
#
#   Materialized.as("order-counts-store"):
#     - Names the state store
#     - State is stored in RocksDB locally
#     - Backed by a changelog topic in Kafka
#     - You can query this store (Interactive Queries ? Section 11)
#
#
# ?????????????????????????????????????????????????????
# 6.2 groupBy() ? Regroup by a different key
# ?????????????????????????????????????????????????????
#
#   // Records currently keyed by orderId, regroup by customerId
#   KTable<String, Long> perCustomer = orderStream
#       .groupBy((key, order) -> KeyValue.pair(
#           order.getCustomerId(), order))               // new key = customerId
#       .count();
#
#   ?? groupBy() causes REPARTITIONING (key change).
#   groupByKey() does NOT (key stays the same).
#   ? PREFER groupByKey() when the existing key is what you need.
#
#
# ?????????????????????????????????????????????????????
# 6.3 reduce() ? Combine values into one
# ?????????????????????????????????????????????????????
#
#   // Sum total revenue per customer
#   KTable<String, Double> totalRevenue = orderStream
#       .groupByKey()
#       .reduce(
#           (aggValue, newValue) -> aggValue + newValue,  // how to combine
#           Materialized.as("revenue-store")
#       );
#
#   Input:  C-1/100, C-2/200, C-1/150, C-1/50
#   State:
#     After record 1: {C-1: 100}
#     After record 2: {C-1: 100, C-2: 200}
#     After record 3: {C-1: 250, C-2: 200}     ? 100 + 150
#     After record 4: {C-1: 300, C-2: 200}     ? 250 + 50
#
#   reduce() rules:
#     - Input and output types MUST be the same
#     - You provide ONE function: (old, new) ? combined
#
#
# ?????????????????????????????????????????????????????
# 6.4 aggregate() ? Most flexible stateful operation
# ?????????????????????????????????????????????????????
#
#   // Build a summary object per customer
#   KTable<String, CustomerSummary> summaries = orderStream
#       .groupByKey()
#       .aggregate(
#           () -> new CustomerSummary(0, 0.0),           // INITIALIZER
#           (key, order, summary) -> {                   // AGGREGATOR
#               summary.setOrderCount(summary.getOrderCount() + 1);
#               summary.setTotalSpent(summary.getTotalSpent() + order.getTotalAmount());
#               return summary;
#           },
#           Materialized.as("customer-summary-store")
#       );
#
#   aggregate() vs reduce():
#     - reduce(): input type = output type (same)
#     - aggregate(): output type can be DIFFERENT from input
#     - aggregate() needs an initializer (starting value)
#
#   Input:  key=C-1, value=Order{amount:100}
#           key=C-1, value=Order{amount:200}
#   State:
#     After record 1: {C-1: Summary{count:1, total:100}}
#     After record 2: {C-1: Summary{count:2, total:300}}
#
#
# ?????????????????????????????????????????????????????
# 6.5 KTable operations ? filter, mapValues on tables
# ?????????????????????????????????????????????????????
#
#   KTables also support stateless operations:
#
#   KTable<String, Long> highCountCustomers = orderCounts
#       .filter((customerId, count) -> count > 10);
#
#   This is reactive: when the count for C-1 changes from 10 to 11,
#   it APPEARS in the filtered table. If it drops back to 10, it DISAPPEARS.
#
#
# ?????????????????????????????????????????????????????
# 6.6 toStream() ? Convert KTable back to KStream
# ?????????????????????????????????????????????????????
#
#   KStream<String, Long> countEvents = orderCounts.toStream();
#   countEvents.to("customer-order-counts");   // write to output topic
#
#   Why? KTable can't write directly to a topic with .to().
#   You convert it to a KStream first, then write.
#
#   When KTable emits to KStream:
#     - Every UPDATE to the table becomes a NEW record in the stream
#     - C-1 count changes from 2 ? 3: stream emits key=C-1, value=3
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 7. WINDOWING ? Time-based grouping
# ???????????????????????????????????????????????????????????????????????????????
#
# Windowing = grouping records into TIME BUCKETS before aggregating.
#
# Without windowing:
#   count() ? total count EVER (since the beginning of time)
#
# With windowing:
#   count() ? count per TIME WINDOW (e.g., per 5 minutes)
#
# Question: "How many orders per customer in the last 5 minutes?"
#   ? This needs a WINDOW.
#
#
# ?????????????????????????????????????????????????????
# 7.1 TUMBLING Window ? Fixed, non-overlapping
# ?????????????????????????????????????????????????????
#
#   Time is divided into fixed-size, non-overlapping chunks.
#
#   5-minute tumbling windows:
#     |  Window 1   |  Window 2   |  Window 3   |
#     | 10:00-10:05 | 10:05-10:10 | 10:10-10:15 |
#     |  ?  ?  ?    |  ?  ?       |  ?  ?  ?  ? |
#        3 events      2 events      4 events
#
#   Each event belongs to EXACTLY ONE window. No overlap.
#
#   Code:
#     KTable<Windowed<String>, Long> windowedCounts = orderStream
#         .groupByKey()
#         .windowedBy(TimeWindows.ofSizeWithNoGrace(Duration.ofMinutes(5)))
#         .count(Materialized.as("windowed-counts"));
#
#   Result key is Windowed<String>:
#     key = [C-1 @ 10:00/10:05]  ? count = 3
#     key = [C-1 @ 10:05/10:10]  ? count = 2
#
#   Use case: "Orders per hour", "Revenue per day", "Events per minute"
#
#
# ?????????????????????????????????????????????????????
# 7.2 HOPPING Window ? Fixed, overlapping
# ?????????????????????????????????????????????????????
#
#   Like tumbling, but windows OVERLAP.
#   Defined by: window SIZE + ADVANCE interval
#
#   5-minute windows, advancing every 1 minute:
#     | Window 1: 10:00-10:05                    |
#     |    | Window 2: 10:01-10:06               |
#     |    |    | Window 3: 10:02-10:07          |
#     |    |    |    | Window 4: 10:03-10:08     |
#
#   A single event at 10:03 belongs to windows 1, 2, 3, AND 4!
#
#   Code:
#     .windowedBy(TimeWindows.ofSizeWithNoGrace(Duration.ofMinutes(5))
#         .advanceBy(Duration.ofMinutes(1)))
#
#   Use case: "Rolling average over last 5 minutes, updated every minute"
#   More expensive than tumbling (each event processed in multiple windows).
#
#
# ?????????????????????????????????????????????????????
# 7.3 SESSION Window ? Activity-based, dynamic size
# ?????????????????????????????????????????????????????
#
#   Groups events by periods of ACTIVITY with gaps of INACTIVITY.
#   Window size is NOT fixed ? it depends on when events arrive.
#
#   Inactivity gap = 5 minutes:
#
#     Events:  10:00  10:02  10:04       10:15  10:17
#              |____Session 1_____|       |__Session 2__|
#              (gap < 5min between       (gap > 5min after 10:04
#               consecutive events)       ? new session starts)
#
#   Code:
#     .windowedBy(SessionWindows.ofInactivityGapWithNoGrace(Duration.ofMinutes(5)))
#
#   Use case: "User sessions on a website", "Customer shopping sessions"
#   Sessions can MERGE: if a late event fills the gap between two sessions,
#   they merge into one bigger session.
#
#
# ?????????????????????????????????????????????????????
# 7.4 SLIDING Window ? Event-driven, exact time range
# ?????????????????????????????????????????????????????
#
#   A window is created for each event, looking BACK a fixed time.
#   Unlike tumbling/hopping, windows are not aligned to clock.
#
#   5-minute sliding window:
#     Event at 10:03 ? window [10:03 - 5min, 10:03] = [09:58, 10:03]
#     Event at 10:07 ? window [10:07 - 5min, 10:07] = [10:02, 10:07]
#
#   Code:
#     .windowedBy(SlidingWindows.ofTimeDifferenceWithNoGrace(Duration.ofMinutes(5)))
#
#   Use case: "How many events within 5 minutes of each other?"
#
#
# ?????????????????????????????????????????????????????
# 7.5 Grace Period ? Handling late events
# ?????????????????????????????????????????????????????
#
#   Real-world problem: events can arrive LATE.
#   An order placed at 10:04 might arrive at the stream processor at 10:07.
#   The 10:00-10:05 window is already "closed" ? what happens?
#
#   Without grace period:
#     ? Late event is DROPPED silently ?
#
#   With grace period:
#     TimeWindows.ofSizeAndGrace(Duration.ofMinutes(5), Duration.ofMinutes(2))
#     ? Window 10:00-10:05 stays OPEN until 10:07 (5min + 2min grace)
#     ? Late event at 10:06 with timestamp 10:04 ? still counted ?
#     ? Late event at 10:08 with timestamp 10:04 ? DROPPED (past grace) ?
#
#   Grace period trade-off:
#     Longer grace ? more late events accepted ? higher memory usage + delayed results
#     Shorter grace ? faster results ? more late events dropped
#
#
# ?????????????????????????????????????????????????????
# 7.6 Event Time vs Processing Time
# ?????????????????????????????????????????????????????
#
#   Which "time" does windowing use?
#
#   EVENT TIME = timestamp embedded IN the record
#     ? When the event ACTUALLY happened
#     ? Set by the producer: record.timestamp()
#     ? Kafka Streams uses this BY DEFAULT
#
#   PROCESSING TIME = when the stream processor PROCESSES the record
#     ? When your code sees the event
#     ? Can differ from event time (due to delays, buffering)
#
#   Kafka Streams uses EVENT TIME by default.
#   This means: even if a record arrives late, it goes into the
#   CORRECT window (based on when it actually happened).
#
#   You can override with a custom TimestampExtractor:
#     config.put(StreamsConfig.DEFAULT_TIMESTAMP_EXTRACTOR_CLASS_CONFIG,
#         WallclockTimestampExtractor.class);  // uses processing time
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 8. JOINS ? Combining data from multiple sources
# ???????????????????????????????????????????????????????????????????????????????
#
# Joins in Kafka Streams work like SQL joins, but on STREAMS.
# They combine records from two sources based on a matching KEY.
#
#
# ?????????????????????????????????????????????????????
# 8.1 Join types ? Inner, Left, Outer
# ?????????????????????????????????????????????????????
#
#   INNER JOIN: Output only when BOTH sides have a matching key
#   LEFT JOIN:  Output for every left record; right side may be null
#   OUTER JOIN: Output for either side; the other may be null
#
#   ???????????????????????????????????????????????????????????????????
#   ? Join Type    ? When does it emit?                               ?
#   ???????????????????????????????????????????????????????????????????
#   ? INNER        ? Only when BOTH left AND right exist for the key ?
#   ? LEFT         ? Always for left; right = null if not found      ?
#   ? OUTER        ? For either side; other = null if not found      ?
#   ???????????????????????????????????????????????????????????????????
#
#
# ?????????????????????????????????????????????????????
# 8.2 KStream-KTable Join ? Enrich events with lookup data
# ?????????????????????????????????????????????????????
#
#   THE most common join. Enrich each event with reference data.
#
#   "For each order, look up the customer's name and email"
#
#   KStream<String, Order> orders = builder.stream("order-events");
#   KTable<String, Customer> customers = builder.table("customer-profiles");
#
#   KStream<String, EnrichedOrder> enriched = orders.join(
#       customers,
#       (order, customer) -> new EnrichedOrder(order, customer.getName())
#   );
#
#   How it works:
#     Order arrives: key=C-1, value=Order{...}
#     ? Kafka Streams looks up key=C-1 in the customer KTable
#     ? Found: Customer{name: "Alice", email: "alice@mail.com"}
#     ? Join function merges: EnrichedOrder{order, "Alice"}
#     ? Output emitted
#
#   ?? REQUIREMENT: Both topics must be CO-PARTITIONED
#     - Same number of partitions
#     - Same key (customerId in both)
#     - Same partitioning strategy (default: murmur2)
#
#     If NOT co-partitioned ? runtime error!
#     Fix: re-key one stream with selectKey() before joining.
#
#
# ?????????????????????????????????????????????????????
# 8.3 KStream-KStream Join ? Join two event streams
# ?????????????????????????????????????????????????????
#
#   Join two STREAMS of events within a TIME WINDOW.
#   Why a window? Because streams are infinite ? you can't wait forever
#   for a matching record on the other side.
#
#   "Match each order with its payment within 10 minutes"
#
#   KStream<String, Order> orders = builder.stream("order-events");
#   KStream<String, Payment> payments = builder.stream("payment-events");
#
#   KStream<String, OrderPayment> matched = orders.join(
#       payments,
#       (order, payment) -> new OrderPayment(order, payment),
#       JoinWindows.ofTimeDifferenceWithNoGrace(Duration.ofMinutes(10))
#   );
#
#   How it works:
#     Order arrives at 10:00 for key=O-1
#     ? Kafka Streams waits up to 10 minutes for a Payment with key=O-1
#     ? Payment arrives at 10:05 for key=O-1
#     ? JOIN! Output: OrderPayment{order, payment}
#
#     If no payment arrives within 10 minutes ? no output (inner join)
#     With leftJoin ? output with payment=null
#
#   ?? Also requires co-partitioning.
#   ?? Window is REQUIRED (unlike KStream-KTable join).
#
#
# ?????????????????????????????????????????????????????
# 8.4 KTable-KTable Join ? Join two state tables
# ?????????????????????????????????????????????????????
#
#   Both sides are KTables. The join result UPDATES when either side changes.
#
#   KTable<String, Customer> customers = builder.table("customers");
#   KTable<String, Address> addresses = builder.table("addresses");
#
#   KTable<String, CustomerAddress> joined = customers.join(
#       addresses,
#       (customer, address) -> new CustomerAddress(customer, address)
#   );
#
#   If customer C-1 updates ? join re-fires with new customer + existing address
#   If address  C-1 updates ? join re-fires with existing customer + new address
#
#   No window needed ? both sides maintain FULL state.
#
#
# ?????????????????????????????????????????????????????
# 8.5 KStream-GlobalKTable Join ? No co-partitioning needed
# ?????????????????????????????????????????????????????
#
#   When you CAN'T co-partition (different keys or partition counts):
#
#   GlobalKTable<String, Country> countries =
#       builder.globalTable("country-codes");
#
#   KStream<String, EnrichedOrder> enriched = orders.join(
#       countries,
#       (orderId, order) -> order.getCountryCode(),   // KEY MAPPER
#       (order, country) -> new EnrichedOrder(order, country.getName())
#   );
#
#   KEY MAPPER: tells Kafka Streams how to find the right record
#   in the GlobalKTable. Here: use order.getCountryCode() as lookup key.
#
#   ? No co-partitioning required
#   ? Works even if topics have different partition counts
#   ? GlobalKTable must be small enough to fit in memory on every instance
#
#
# ?????????????????????????????????????????????????????
# 8.6 Join Summary Table
# ?????????????????????????????????????????????????????
#
#   ???????????????????????????????????????????????????????????????????
#   ? Join Type             ? Window?  ? Co-part?  ? Use Case         ?
#   ???????????????????????????????????????????????????????????????????
#   ? KStream-KTable        ? No       ? Yes       ? Event enrichment ?
#   ? KStream-KStream       ? Yes      ? Yes       ? Correlate events ?
#   ? KTable-KTable         ? No       ? Yes       ? Join dimensions  ?
#   ? KStream-GlobalKTable  ? No       ? No        ? Small lookups    ?
#   ???????????????????????????????????????????????????????????????????
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 9. STATE STORES ? Where state lives
# ???????????????????????????????????????????????????????????????????????????????
#
# Every stateful operation (count, reduce, aggregate, join) needs a state store.
# Kafka Streams manages these automatically, but understanding them is critical.
#
#
# ?????????????????????????????????????????????????????
# 9.1 RocksDB ? The default state store
# ?????????????????????????????????????????????????????
#
#   RocksDB is an embedded key-value database (from Facebook).
#   It stores data on LOCAL DISK, not in JVM heap.
#
#   ???????????????????????????????????????????????????????????????
#   ?  Your Kafka Streams App (Instance 1)                        ?
#   ?                                                             ?
#   ?  ????????????????????????????????????????????????????       ?
#   ?  ?  State Store: "order-counts-store"               ?       ?
#   ?  ?  ????????????????????????????????????????????    ?       ?
#   ?  ?  ?  RocksDB                                 ?    ?       ?
#   ?  ?  ?  C-1 ? 42                                ?    ?       ?
#   ?  ?  ?  C-2 ? 17                                ?    ?       ?
#   ?  ?  ?  C-3 ? 95                                ?    ?       ?
#   ?  ?  ?  (stored on LOCAL DISK, not JVM heap)    ?    ?       ?
#   ?  ?  ????????????????????????????????????????????    ?       ?
#   ?  ????????????????????????????????????????????????????       ?
#   ?                                                             ?
#   ?  state.dir = /tmp/kafka-streams/order-analytics/            ?
#   ???????????????????????????????????????????????????????????????
#
#   Why RocksDB (not HashMap)?
#     ? Can hold MORE data than JVM memory (it's on disk)
#     ? Survives JVM garbage collection pauses
#     ? Efficient reads: uses bloom filters + block cache
#     ? Slightly slower than in-memory (disk I/O)
#
#   You CAN use in-memory stores instead:
#     Materialized.as(Stores.inMemoryKeyValueStore("my-store"))
#     ? Faster reads
#     ? Limited by JVM heap size
#     ? Lost on restart (rebuilt from changelog)
#
#
# ?????????????????????????????????????????????????????
# 9.2 Changelog Topics ? Fault tolerance for state
# ?????????????????????????????????????????????????????
#
#   Every state store is backed by a CHANGELOG TOPIC in Kafka.
#   Every write to RocksDB is ALSO written to this topic.
#
#   ???????????????????      ???????????????????????????????????
#   ?  RocksDB        ????????  Changelog Topic (in Kafka)     ?
#   ?  C-1 ? 42       ?      ?  C-1 ? 42                       ?
#   ?  C-2 ? 17       ?      ?  C-2 ? 17                       ?
#   ???????????????????      ?  (compacted ? keeps latest only)?
#                             ???????????????????????????????????
#
#   If Instance 1 CRASHES:
#     1. Instance 2 takes over the partitions
#     2. Instance 2 rebuilds RocksDB by replaying the changelog topic
#     3. State is fully restored ? no data loss!
#
#   The changelog topic is COMPACTED:
#     - Only the LATEST value per key is kept
#     - Old values are removed during compaction
#     - Recovery only replays the latest state, not full history
#     - This makes recovery FAST
#
#
# ?????????????????????????????????????????????????????
# 9.3 Standby Replicas ? Faster recovery
# ?????????????????????????????????????????????????????
#
#   Problem: rebuilding state from changelog can take time for large stores.
#
#   Solution: STANDBY REPLICAS
#     config.put(StreamsConfig.NUM_STANDBY_REPLICAS_CONFIG, 1);
#
#   A standby replica is a "warm" copy of the state store on ANOTHER instance.
#   It continuously replays the changelog topic in the background.
#
#   If the primary instance crashes:
#     ? Standby already has the state up-to-date
#     ? Takes over INSTANTLY (no rebuild time)
#
#   Trade-off: more network + disk usage for faster failover.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 10. THREADING MODEL ? How Kafka Streams parallelizes work
# ???????????????????????????????????????????????????????????????????????????????
#
# Kafka Streams uses a model of: Application ? Instances ? Threads ? Tasks
#
#
# ?????????????????????????????????????????????????????
# 10.1 The hierarchy: Instance ? Thread ? Task
# ?????????????????????????????????????????????????????
#
#   APPLICATION (identified by application.id)
#     ??? Instance 1 (JVM process ? e.g., your Spring Boot app)
#     ?     ??? Stream Thread 1
#     ?     ?     ??? Task 0 (processes partition 0)
#     ?     ?     ??? Task 1 (processes partition 1)
#     ?     ??? Stream Thread 2
#     ?           ??? Task 2 (processes partition 2)
#     ??? Instance 2 (another JVM process ? same app, different machine)
#           ??? Stream Thread 1
#                 ??? Task 3 (processes partition 3)
#                 ??? Task 4 (processes partition 4)
#
#   KEY CONCEPT: The number of TASKS = number of INPUT PARTITIONS
#
#   If order-events has 6 partitions ? 6 tasks created.
#   Tasks are distributed across threads and instances.
#
#
# ?????????????????????????????????????????????????????
# 10.2 What is a Task?
# ?????????????????????????????????????????????????????
#
#   A Task = the topology applied to ONE partition.
#
#   Each task:
#     - Is assigned one or more input partitions
#     - Has its OWN state stores (RocksDB) for those partitions
#     - Runs the COMPLETE topology from source to sink
#     - Is the unit of PARALLELISM
#
#   Tasks are INDEPENDENT ? they don't share state.
#   This is why Kafka Streams scales: each task processes its own data.
#
#
# ?????????????????????????????????????????????????????
# 10.3 Configuration: num.stream.threads
# ?????????????????????????????????????????????????????
#
#   config.put(StreamsConfig.NUM_STREAM_THREADS_CONFIG, 3);
#   // or in Spring Boot:
#   spring.kafka.streams.properties.num.stream.threads=3
#
#   This controls how many threads PER INSTANCE.
#   More threads = more parallelism within a single JVM.
#
#   Rule of thumb:
#     num.stream.threads ? number of input partitions assigned to this instance
#     (More threads than partitions = idle threads doing nothing)
#
#
# ?????????????????????????????????????????????????????
# 10.4 Scaling ? Just start more instances
# ?????????????????????????????????????????????????????
#
#   This is the beauty of Kafka Streams:
#
#   To scale: just start another copy of your Spring Boot app.
#   Kafka Streams uses the Kafka Consumer Group protocol to
#   automatically rebalance tasks across instances.
#
#   Example: order-events has 6 partitions
#
#   1 instance, 1 thread:
#     Instance 1: Tasks 0,1,2,3,4,5   (handles everything)
#
#   1 instance, 3 threads:
#     Thread 1: Tasks 0,1   Thread 2: Tasks 2,3   Thread 3: Tasks 4,5
#
#   2 instances, 3 threads each:
#     Instance 1: Thread 1: Task 0   Thread 2: Task 1   Thread 3: Task 2
#     Instance 2: Thread 1: Task 3   Thread 2: Task 4   Thread 3: Task 5
#
#   3 instances, 2 threads each:
#     Instance 1: Thread 1: Task 0   Thread 2: Task 1
#     Instance 2: Thread 1: Task 2   Thread 2: Task 3
#     Instance 3: Thread 1: Task 4   Thread 2: Task 5
#
#   Maximum parallelism = number of input partitions.
#   More instances/threads than partitions = some are idle.
#
#
# ?????????????????????????????????????????????????????
# 10.5 Rebalancing ? What happens when instances change
# ?????????????????????????????????????????????????????
#
#   When an instance joins or leaves, Kafka Streams:
#     1. Triggers a REBALANCE (via consumer group protocol)
#     2. Tasks are redistributed across remaining instances
#     3. State stores for moved tasks are rebuilt on the new instance
#        (from changelog topic, or from standby replicas)
#
#   This is EXACTLY like consumer group rebalancing.
#   Kafka Streams IS a consumer under the hood ? it uses the same
#   group coordinator, partition assignment, and offset management.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 11. EXACTLY-ONCE in Kafka Streams ? Simpler than you think
# ???????????????????????????????????????????????????????????????????????????????
#
# Remember from Kafka Transactions:
#   Exactly-once = idempotent producer + transactions + read_committed
#   We had to configure all of that MANUALLY.
#
# In Kafka Streams? ONE LINE:
#
#   config.put(StreamsConfig.PROCESSING_GUARANTEE_CONFIG,
#       StreamsConfig.EXACTLY_ONCE_V2);
#
#   // or in Spring Boot:
#   spring.kafka.streams.properties.processing.guarantee=exactly_once_v2
#
# That's it. Kafka Streams handles:
#   ? Idempotent producer (enable.idempotence=true)
#   ? Transactional producer (transactional.id auto-generated per task)
#   ? Consumer isolation.level=read_committed
#   ? Atomic read-process-write: input offsets + state store changes +
#      output records all committed in ONE transaction
#
# What exactly-once means in Streams:
#   "Each input record is processed EXACTLY ONCE, and the resulting
#    state changes and output records are committed ATOMICALLY."
#
#   If the app crashes mid-processing:
#     ? Transaction is not committed
#     ? On restart: reads from last committed offset
#     ? Processes the record again (but output is idempotent)
#     ? No duplicates, no lost records
#
# Default is "at_least_once" (faster, but possible duplicates on crash).
# Use "exactly_once_v2" for critical data (financial, inventory, etc.).
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 12. INTERACTIVE QUERIES ? Query state without external DB
# ???????????????????????????????????????????????????????????????????????????????
#
# Your Kafka Streams app maintains state stores (RocksDB).
# Interactive Queries let you QUERY those stores directly via REST API.
#
# "How many orders has customer C-1 placed?" ? Query the state store!
# No external database needed (no Redis, no Postgres for this use case).
#
#   // Get a handle to the store
#   ReadOnlyKeyValueStore<String, Long> store =
#       streams.store(
#           StoreQueryParameters.fromNameAndType(
#               "order-counts-store",
#               QueryableStoreTypes.keyValueStore()
#           )
#       );
#
#   // Query it
#   Long count = store.get("C-1");  // ? 42
#
#   // Iterate all entries
#   KeyValueIterator<String, Long> all = store.all();
#   while (all.hasNext()) {
#       KeyValue<String, Long> entry = all.next();
#       // entry.key = "C-1", entry.value = 42
#   }
#
# Expose via REST (in Spring Boot):
#   @GetMapping("/orders/count/{customerId}")
#   public Long getOrderCount(@PathVariable String customerId) {
#       return store.get(customerId);
#   }
#
# LIMITATION: Each instance only has state for its assigned partitions.
#   Instance 1 has C-1, C-2 (partitions 0,1)
#   Instance 2 has C-3, C-4 (partition 2)
#   Query for C-3 on Instance 1 ? null!
#
# SOLUTION: Kafka Streams metadata API tells you WHICH instance has the key:
#   streams.queryMetadataForKey("order-counts-store", "C-3", ...)
#   ? Returns: instance2:8080
#   ? You proxy the request to Instance 2.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 13. DSL vs PROCESSOR API ? Two ways to define topologies
# ???????????????????????????????????????????????????????????????????????????????
#
# We've been using the DSL (Domain-Specific Language) throughout these notes.
# There's also a lower-level Processor API.
#
#   ?????????????????????????????????????????????????????????????????????????
#   ? Feature                ? DSL                  ? Processor API         ?
#   ?????????????????????????????????????????????????????????????????????????
#   ? Abstraction level      ? HIGH                 ? LOW                   ?
#   ? Code style             ? Functional chains    ? Imperative per-record ?
#   ? Operations             ? filter, map, join,   ? process(), punctuate()?
#   ?                        ? groupBy, aggregate   ? direct store access   ?
#   ? State stores           ? Auto-managed         ? Manual management     ?
#   ? Scheduling             ? Not available        ? punctuate() for timer ?
#   ? When to use            ? 90% of use cases     ? Custom/complex logic  ?
#   ? Learning curve         ? Easy                 ? Steeper               ?
#   ?????????????????????????????????????????????????????????????????????????
#
# Processor API example (same count logic):
#   builder.addSource("source", "order-events");
#   builder.addProcessor("counter", () -> new CountProcessor(), "source");
#   builder.addStateStore(
#       Stores.keyValueStoreBuilder(
#           Stores.persistentKeyValueStore("counts"),
#           Serdes.String(), Serdes.Long()),
#       "counter");
#   builder.addSink("sink", "order-counts", "counter");
#
# You CAN mix DSL and Processor API:
#   orderStream
#       .filter(...)
#       .process(() -> new CustomProcessor(), "my-store")  // drop into Processor API
#       .mapValues(...)                                    // back to DSL
#
# Rule: Start with DSL. Only drop to Processor API when DSL can't do what you need.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 14. INTERNAL TOPICS ? What Kafka Streams creates automatically
# ???????????????????????????????????????????????????????????????????????????????
#
# Kafka Streams creates internal topics in Kafka. You'll see them in kafka-topics list.
#
#   ??????????????????????????????????????????????????????????????????????????
#   ? Topic pattern                      ? Purpose                          ?
#   ??????????????????????????????????????????????????????????????????????????
#   ? <app-id>-<store>-changelog         ? State store backup (compacted)   ?
#   ? <app-id>-<store>-repartition       ? Repartitioning (key changes)     ?
#   ? <app-id>-KSTREAM-xxx-repartition   ? Auto-created repartition topic   ?
#   ??????????????????????????????????????????????????????????????????????????
#
#   Example with app-id = "order-analytics":
#     order-analytics-order-counts-store-changelog
#     order-analytics-KSTREAM-MAP-0000000003-repartition
#
#   ?? DO NOT delete these topics manually!
#   They are managed by Kafka Streams. Deleting them = data loss.
#
#   ?? Changing the topology (e.g., adding a new filter step) may create
#   NEW internal topics. Old ones may become orphaned.
#   Use application.reset tool to clean up:
#     kafka-streams-application-reset --application-id order-analytics
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 15. ERROR HANDLING ? What happens when things go wrong
# ???????????????????????????????????????????????????????????????????????????????
#
# ?????????????????????????????????????????????????????
# 15.1 Deserialization errors
# ?????????????????????????????????????????????????????
#
#   What if a record can't be deserialized (corrupt data, wrong format)?
#
#   Default behavior: throws exception ? stream thread DIES.
#
#   Better: configure a DeserializationExceptionHandler:
#
#   config.put(StreamsConfig.DEFAULT_DESERIALIZATION_EXCEPTION_HANDLER_CLASS_CONFIG,
#       LogAndContinueExceptionHandler.class);  // log and skip the bad record
#
#   Options:
#     LogAndContinueExceptionHandler ? skip bad record, log it, continue
#     LogAndFailExceptionHandler     ? log it and stop (default)
#     Custom implementation          ? send to dead-letter topic, alert, etc.
#
#
# ?????????????????????????????????????????????????????
# 15.2 Production errors (writes to output/changelog)
# ?????????????????????????????????????????????????????
#
#   What if writing to an output topic fails?
#
#   config.put(StreamsConfig.DEFAULT_PRODUCTION_EXCEPTION_HANDLER_CLASS_CONFIG,
#       DefaultProductionExceptionHandler.class);
#
#   Options:
#     CONTINUE ? skip the failed record
#     FAIL     ? stop processing (default)
#
#
# ?????????????????????????????????????????????????????
# 15.3 Uncaught exceptions
# ?????????????????????????????????????????????????????
#
#   streams.setUncaughtExceptionHandler((exception) -> {
#       log.error("Stream thread failed", exception);
#       return StreamsUncaughtExceptionHandler.StreamThreadExceptionResponse
#           .REPLACE_THREAD;  // restart the thread
#   });
#
#   Options:
#     REPLACE_THREAD   ? restart just the failed thread
#     SHUTDOWN_CLIENT  ? shut down this instance gracefully
#     SHUTDOWN_APPLICATION ? shut down ALL instances (via encoding in offsets)
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 16. KAFKA STREAMS vs ALTERNATIVES ? When to use what
# ???????????????????????????????????????????????????????????????????????????????
#
#   ??????????????????????????????????????????????????????????????????????????
#   ? Technology      ? When to use                                         ?
#   ??????????????????????????????????????????????????????????????????????????
#   ? Consumer API    ? Simple consume-and-process (no state, no joins)     ?
#   ?                 ? "Read message ? call REST API ? done"              ?
#   ?                 ? No aggregation, no time windows needed              ?
#   ??????????????????????????????????????????????????????????????????????????
#   ? Kafka Streams   ? Stream processing within a microservice             ?
#   ?                 ? Stateful: aggregations, joins, windows              ?
#   ?                 ? Kafka-to-Kafka pipelines                            ?
#   ?                 ? Want to stay lightweight (no separate cluster)      ?
#   ?                 ? Java/Kotlin applications                            ?
#   ??????????????????????????????????????????????????????????????????????????
#   ? Apache Flink    ? Very high throughput (millions of events/sec)       ?
#   ?                 ? Complex event processing (CEP patterns)             ?
#   ?                 ? Multiple sources beyond Kafka (files, DBs, etc.)   ?
#   ?                 ? Need batch + stream processing (unified)            ?
#   ?                 ? Team can manage a separate Flink cluster            ?
#   ??????????????????????????????????????????????????????????????????????????
#   ? Apache Spark    ? Batch processing primarily (ETL, analytics)         ?
#   ? Streaming       ? Micro-batch model (not true real-time)              ?
#   ?                 ? Machine learning pipelines                          ?
#   ?                 ? Already have Spark infrastructure                   ?
#   ??????????????????????????????????????????????????????????????????????????
#   ? ksqlDB          ? SQL-based stream processing on Kafka                ?
#   ?                 ? Non-developers (data analysts) need to query streams?
#   ?                 ? Quick prototyping without writing Java              ?
#   ?                 ? Runs as a separate server (unlike Streams library)  ?
#   ??????????????????????????????????????????????????????????????????????????
#
#   Decision flowchart:
#
#     Is it Kafka-to-Kafka only?
#       ??? NO ? Consider Flink (multi-source support)
#       ??? YES
#            Need stateful processing (aggregation/join/window)?
#              ??? NO ? Consumer API is enough
#              ??? YES
#                   Want to avoid managing a separate cluster?
#                     ??? YES ? Kafka Streams ?
#                     ??? NO ? Flink (more features, more ops overhead)
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 17. SPRING BOOT + KAFKA STREAMS ? Configuration Reference
# ???????????????????????????????????????????????????????????????????????????????
#
# Spring Boot provides first-class support for Kafka Streams via spring-kafka.
#
# ?????????????????????????????????????????????????????
# 17.1 Dependencies (pom.xml)
# ?????????????????????????????????????????????????????
#
#   <dependency>
#       <groupId>org.apache.kafka</groupId>
#       <artifactId>kafka-streams</artifactId>
#   </dependency>
#   <dependency>
#       <groupId>org.springframework.kafka</groupId>
#       <artifactId>spring-kafka</artifactId>
#   </dependency>
#
#   kafka-streams ? the core Kafka Streams library
#   spring-kafka  ? Spring Boot auto-configuration for Streams
#
#
# ?????????????????????????????????????????????????????
# 17.2 application.properties
# ?????????????????????????????????????????????????????
#
#   # REQUIRED: unique app identifier (also used as consumer group.id)
#   spring.kafka.streams.application-id=order-analytics
#
#   # Kafka broker addresses
#   spring.kafka.streams.bootstrap-servers=localhost:9092,localhost:9192
#
#   # Default serializer/deserializer for keys and values
#   spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
#   spring.kafka.streams.properties.default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
#
#   # Number of stream threads per instance
#   spring.kafka.streams.properties.num.stream.threads=3
#
#   # State store directory
#   spring.kafka.streams.properties.state.dir=/tmp/kafka-streams
#
#   # Processing guarantee
#   spring.kafka.streams.properties.processing.guarantee=exactly_once_v2
#
#   # Standby replicas
#   spring.kafka.streams.properties.num.standby.replicas=1
#
#
# ?????????????????????????????????????????????????????
# 17.3 Defining the topology in Spring Boot
# ?????????????????????????????????????????????????????
#
#   In Spring Boot, you define the topology via a @Bean:
#
#   @Configuration
#   public class KafkaStreamsConfig {
#
#       @Bean
#       public KafkaStreamsConfiguration kStreamsConfig() {
#           // Auto-configured by Spring Boot from application.properties
#       }
#
#       @Bean
#       public KStream<String, Order> orderProcessingTopology(StreamsBuilder builder) {
#           KStream<String, Order> orders = builder.stream("order-events");
#
#           orders
#               .filter((key, order) -> order.getTotalAmount() > 100)
#               .groupByKey()
#               .count(Materialized.as("order-counts"))
#               .toStream()
#               .to("high-value-counts");
#
#           return orders;
#       }
#   }
#
#   Spring Boot auto-starts the KafkaStreams instance.
#   The topology runs as soon as the application starts.
#   On shutdown, Spring gracefully stops the streams.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 18. SUMMARY ? One-glance mental model
# ???????????????????????????????????????????????????????????????????????????????
#
#   ????????????????????????????????????????????????????????????????????????????
#   ? Concept                    ? Key Takeaway                               ?
#   ????????????????????????????????????????????????????????????????????????????
#   ? What is Kafka Streams?     ? Client LIBRARY, not a cluster. JAR in app  ?
#   ? Topology                   ? DAG of processors: Source ? Process ? Sink ?
#   ? KStream                    ? Infinite event log. Every record matters   ?
#   ? KTable                     ? Latest value per key. Like a DB table      ?
#   ? GlobalKTable               ? Full KTable copy on every instance         ?
#   ? Stateless ops              ? filter, map, flatMap, branch, merge, peek  ?
#   ? Stateful ops               ? count, reduce, aggregate (need state store)?
#   ? Windowing                  ? Tumbling, Hopping, Session, Sliding        ?
#   ? Joins                      ? KStream-KTable, KStream-KStream,           ?
#   ?                            ? KTable-KTable, KStream-GlobalKTable        ?
#   ? State stores               ? RocksDB (default), backed by changelog     ?
#   ? Threading                  ? App ? Instance ? Thread ? Task             ?
#   ? Tasks                      ? # tasks = # input partitions               ?
#   ? Scaling                    ? Start more instances. Auto-rebalance       ?
#   ? Exactly-once               ? processing.guarantee=exactly_once_v2       ?
#   ? Interactive queries        ? Query state stores via REST API            ?
#   ? Error handling             ? Deserialization, production, uncaught      ?
#   ? Internal topics            ? changelog (state backup), repartition      ?
#   ? Repartitioning             ? Key change ? auto repartition topic        ?
#   ? Co-partitioning            ? Required for joins (except GlobalKTable)   ?
#   ? DSL vs Processor API       ? DSL for 90% cases, Processor for custom   ?
#   ????????????????????????????????????????????????????????????????????????????
#
#
#   THE BIG PICTURE:
#
#   ???????????????????     ??????????????????????????????????????     ????????????????????
#   ?  Input Topic    ???????  Your Spring Boot App              ???????  Output Topic    ?
#   ?  (order-events) ?     ?  ????????????????????????????????  ?     ?  (order-counts)  ?
#   ?                 ?     ?  ?  Kafka Streams Topology       ?  ?     ?                  ?
#   ?                 ?     ?  ?  Source ? Filter ? GroupBy     ?  ?     ?                  ?
#   ?                 ?     ?  ?  ? Count ? Sink               ?  ?     ?                  ?
#   ?                 ?     ?  ????????????????????????????????  ?     ?                  ?
#   ?                 ?     ?                 ?                   ?     ?                  ?
#   ?                 ?     ?  ????????????????????????????????  ?     ?                  ?
#   ?                 ?     ?  ?  State Store (RocksDB)       ?  ?     ?                  ?
#   ?                 ?     ?  ?  C-1 ? 42, C-2 ? 17         ?  ?     ?                  ?
#   ?                 ?     ?  ????????????????????????????????  ?     ?                  ?
#   ?                 ?     ??????????????????????????????????????     ?                  ?
#   ???????????????????                                               ????????????????????
