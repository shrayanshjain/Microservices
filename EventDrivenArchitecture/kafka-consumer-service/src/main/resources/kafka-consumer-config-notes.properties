# ============================================================================
# ALL POSSIBLE KAFKA CONSUMER CONFIGS IN SPRING BOOT (application.properties)
# ============================================================================
# This is a REFERENCE file ? not loaded by Spring Boot.
# Copy any property you need into application.properties.
#
# Organized by: what you'll actually need first ? what you'll rarely touch.
#
#
# ============================================================================
# SECTION 1: AUTHENTICATION (how consumer finds the Kafka cluster)
# ============================================================================

#
# spring.kafka.properties.security.protocol=PLAINTEXT
#   How to connect: PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL
#   Default: PLAINTEXT (no encryption, no auth)
#   For production with auth: SASL_SSL
#   Maps to: security.protocol
#
# spring.kafka.properties.sasl.mechanism=PLAIN
#   Auth mechanism: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512, OAUTHBEARER, GSSAPI
#   Only relevant when security.protocol includes SASL
#   Maps to: sasl.mechanism
#
# spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="user" password="pass";
#   JAAS config inline (instead of a separate jaas.conf file)
#   Maps to: sasl.jaas.config
#
# spring.kafka.ssl.trust-store-location=classpath:truststore.jks
# spring.kafka.ssl.trust-store-password=changeit
# spring.kafka.ssl.key-store-location=classpath:keystore.jks
# spring.kafka.ssl.key-store-password=changeit
# spring.kafka.ssl.key-store-type=JKS
#   SSL/TLS settings. Only needed when security.protocol includes SSL.
#   trust-store = "which brokers do I trust?"
#   key-store = "my identity" (for mutual TLS / mTLS)
#
#
# ============================================================================
# SECTION 2: CONSUMER GROUP (how consumers coordinate)
# ============================================================================
#


#
# spring.kafka.consumer.properties.partition.assignment.strategy=\
#   org.apache.kafka.clients.consumer.CooperativeStickyAssignor
#   How partitions are divided among consumers in the group.
#   Options:
#     RangeAssignor (default) ? assigns contiguous partition ranges per topic
#     RoundRobinAssignor ? distributes partitions round-robin across consumers
#     StickyAssignor ? like RoundRobin but tries to keep existing assignments
#     CooperativeStickyAssignor ? same as Sticky but uses INCREMENTAL rebalance
#       (consumers don't stop consuming during rebalance ? RECOMMENDED)
#   Maps to: partition.assignment.strategy
#
#
# ============================================================================
# SECTION 3: DESERIALIZATION (how bytes become Java objects)
# ============================================================================
#
# spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#   How to convert the record KEY from bytes to a Java object.
#   Common options:
#     StringDeserializer ? most common, keys are usually strings
#     LongDeserializer, IntegerDeserializer ? for numeric keys
#     ByteArrayDeserializer ? raw bytes, you handle conversion
#   Maps to: key.deserializer
#
# spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
#   How to convert the record VALUE from bytes to a Java object.
#   Common options:
#     StringDeserializer ? get raw JSON string, deserialize yourself
#     JsonDeserializer (Spring) ? auto-converts JSON to your POJO
#     ByteArrayDeserializer ? raw bytes
#     AvroDeserializer (Confluent) ? for Avro schemas
#   Maps to: value.deserializer
#
# --- JsonDeserializer-specific configs (only when using Spring's JsonDeserializer) ---
#
# spring.kafka.consumer.properties.spring.json.trusted.packages=com.eda.consumer.*
#   Which packages are allowed for deserialization.
#   JsonDeserializer refuses to deserialize classes from untrusted packages
#   (security measure against deserialization attacks).
#   Use * to trust all packages (not recommended for production).
#   Default: only java.util, java.lang
#
# spring.kafka.consumer.properties.spring.json.value.default.type=com.eda.consumer.model.Order
#   Default target class for deserialization when no __TypeId__ header is present
#   or when type headers are disabled.
#   "If you don't know what type it is, deserialize to this class"
#
# spring.kafka.consumer.properties.spring.json.use.type.headers=false
#   Whether to look at __TypeId__ header from producer to determine target class.
#   true (default) ? reads __TypeId__ header, tries to load that class
#   false ? ignores header, uses default.type or @KafkaListener method param type
#   Set to false when producer and consumer have different package names for
#   the same class (avoids ClassNotFoundException).
#
# spring.kafka.consumer.properties.spring.json.type.mapping=\
#   com.eda.producer.model.Order:com.eda.consumer.model.Order,\
#   com.eda.producer.model.Payment:com.eda.consumer.model.Payment
#   Maps producer's class names to consumer's class names.
#   "When __TypeId__ says 'producer.Order', deserialize to 'consumer.Order'"
#   Alternative to setting use.type.headers=false.
#
# --- ErrorHandlingDeserializer (wraps your deserializer to handle bad data) ---
#
# spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
# spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
#   Wraps JsonDeserializer. If deserialization fails (bad JSON, wrong type),
#   instead of crashing the consumer, it passes a null value with the
#   exception in a header. Your listener can then handle it gracefully.
#   Without this: one bad message = consumer stops.
#
#
# ============================================================================
# SECTION 4: OFFSET MANAGEMENT (where to start reading, how to commit)
# ============================================================================
#
# spring.kafka.consumer.auto-offset-reset=latest
#   What to do when there's NO committed offset for this group+partition.
#   This happens when:
#     - Brand new consumer group (never consumed before)
#     - Committed offset is out of range (data was deleted by retention)
#   Options:
#     latest (default) ? start from newest message (skip history)
#     earliest ? start from oldest available message (read everything)
#     none ? throw exception (fail fast if no committed offset)
#   Maps to: auto.offset.reset
#
#   IMPORTANT: This ONLY applies when there's no committed offset.
#   If consumer has committed offset 500, it resumes from 501 regardless
#   of this setting.
#
# spring.kafka.consumer.enable-auto-commit=false
#   Whether the Kafka CLIENT auto-commits offsets periodically.
#   true ? Kafka client commits every auto.commit.interval.ms (5s default)
#   false (Spring default) ? Spring manages commits via AckMode
#
#   SPRING OVERRIDES THIS TO false BY DEFAULT because Spring has its own
#   commit strategy (AckMode). If you set this to true, you bypass Spring's
#   offset management ? generally not recommended.
#   Maps to: enable.auto.commit
#
# spring.kafka.consumer.properties.auto.commit.interval.ms=5000
#   How often Kafka client auto-commits (only if enable-auto-commit=true).
#   Default: 5000ms (5 seconds)
#   Maps to: auto.commit.interval.ms
#
#
# ============================================================================
# SECTION 5: SPRING LISTENER CONTAINER CONFIG (spring.kafka.listener.*)
# ============================================================================
#
# These are SPRING-SPECIFIC configs (not raw Kafka properties).
# They control the KafkaMessageListenerContainer behavior.
#
# spring.kafka.listener.type=single
#   How records are delivered to your @KafkaListener method.
#   single (default) ? one record at a time: consume(Order order)
#   batch ? all records from one poll(): consume(List<Order> orders)
#   Maps to: ContainerProperties.setMessageListener() type
#
# spring.kafka.listener.concurrency=1
#   Number of consumer threads (KafkaMessageListenerContainers) per listener.
#   1 (default) ? 1 thread, 1 KafkaConsumer
#   3 ? 3 threads, 3 KafkaConsumers, all in same group
#   Set this to number of partitions for max parallelism.
#   More threads than partitions = idle threads (wasted).
#   Maps to: ConcurrentKafkaListenerContainerFactory.setConcurrency()
#
# spring.kafka.listener.ack-mode=batch
#   When Spring commits offsets. Options:
#     BATCH (default) ? commit after all records from poll() are processed
#     RECORD ? commit after EACH record is processed
#     TIME ? commit every ack-time milliseconds
#     COUNT ? commit every ack-count records
#     COUNT_TIME ? commit on whichever comes first: count or time
#     MANUAL ? you call acknowledgment.acknowledge() in your listener
#     MANUAL_IMMEDIATE ? same as MANUAL but commits immediately (not batched)
#   Maps to: ContainerProperties.setAckMode()
#
#   For MANUAL mode, your listener must accept Acknowledgment:
#     @KafkaListener(topics = "order-events")
#     public void consume(Order order, Acknowledgment ack) {
#         // process order
#         ack.acknowledge();  // commit offset NOW
#     }
#
# spring.kafka.listener.ack-count=10
#   Commit after this many records (only for ack-mode=COUNT or COUNT_TIME).
#   Default: 1
#
# spring.kafka.listener.ack-time=5000
#   Commit after this many milliseconds (only for ack-mode=TIME or COUNT_TIME).
#   Default: 5000ms
#
# spring.kafka.listener.poll-timeout=5000
#   How long poll() blocks waiting for records (milliseconds).
#   Default: 5000ms
#   This is the Duration passed to consumer.poll(Duration.ofMillis(X))
#   Maps to: ContainerProperties.setPollTimeout()
#
# spring.kafka.listener.no-poll-threshold=3.0
#   If no poll() happens within (pollTimeout * noPollThreshold) ms,
#   a NonResponsiveConsumerEvent is published.
#   Default: 3.0 (so 5000ms * 3.0 = 15 seconds)
#   Useful for monitoring: "is my consumer stuck?"
#
# spring.kafka.listener.idle-between-polls=0
#   Milliseconds to sleep between poll() calls.
#   Default: 0 (poll as fast as possible)
#   Set this to throttle consumption rate.
#
# spring.kafka.listener.idle-event-interval=null
#   If set, publishes ListenerContainerIdleEvent when no records received
#   for this many milliseconds. Useful for "nothing to consume" monitoring.
#   Default: null (disabled)
#
# spring.kafka.listener.monitor-interval=30
#   How often (seconds) to check if consumer thread is stuck.
#   Default: 30 seconds
#
# spring.kafka.listener.log-container-config=false
#   Log the container configuration at INFO level on startup.
#   Default: false. Set to true for debugging.
#
#
# ============================================================================
# SECTION 6: POLLING & SESSION (consumer liveness)
# ============================================================================
#
# These 3 configs work together to determine if a consumer is "alive":
#
# spring.kafka.consumer.properties.session.timeout.ms=45000
#   How long broker waits for a heartbeat before declaring consumer dead.
#   If no heartbeat received within this time -> consumer removed from group
#   -> rebalance triggered.
#   Default: 45000ms (45 seconds)
#   Maps to: session.timeout.ms
#
# spring.kafka.consumer.properties.heartbeat.interval.ms=3000
#   How often consumer sends heartbeat to group coordinator.
#   Must be less than session.timeout.ms (typically 1/3 of it).
#   Default: 3000ms (3 seconds)
#   Maps to: heartbeat.interval.ms
#
# spring.kafka.consumer.properties.max.poll.interval.ms=300000
#   Max time between two poll() calls. If your processing takes longer
#   than this, broker assumes consumer is stuck -> removes from group.
#   Default: 300000ms (5 minutes)
#   Increase this if your processing is slow (e.g., DB writes, API calls).
#   Maps to: max.poll.interval.ms
#
#   RELATIONSHIP BETWEEN THE THREE:
#     heartbeat.interval.ms < session.timeout.ms < max.poll.interval.ms
#     3000ms               < 45000ms             < 300000ms
#
#     Heartbeat: "I'm alive" (sent by background thread)
#     Session timeout: "How long to wait for heartbeat before declaring dead"
#     Max poll interval: "How long between poll() calls before declaring stuck"
#
#     A consumer can be alive (sending heartbeats) but stuck (not calling poll).
#     max.poll.interval.ms catches this case.
#
# spring.kafka.consumer.properties.max.poll.records=500
#   Maximum records returned per poll() call.
#   Default: 500
#   Lower this if each record takes long to process (to avoid
#   exceeding max.poll.interval.ms).
#   Higher = more throughput but longer processing time per batch.
#   Maps to: max.poll.records
#
#
# ============================================================================
# SECTION 7: FETCH TUNING (how much data to pull from broker)
# ============================================================================
#
# spring.kafka.consumer.properties.fetch.min.bytes=1
#   Minimum bytes broker should accumulate before responding to fetch.
#   Default: 1 (return immediately even with 1 byte)
#   Increase for throughput: broker batches more data before responding.
#   Maps to: fetch.min.bytes
#
# spring.kafka.consumer.properties.fetch.max.bytes=52428800
#   Maximum bytes per fetch response (across ALL partitions).
#   Default: 52428800 (50 MB)
#   Maps to: fetch.max.bytes
#
# spring.kafka.consumer.properties.fetch.max.wait.ms=500
#   Max time broker waits to accumulate fetch.min.bytes before responding.
#   Default: 500ms
#   If fetch.min.bytes=1, this is mostly irrelevant (returns immediately).
#   If fetch.min.bytes=10000, broker waits up to 500ms to collect 10KB.
#   Maps to: fetch.max.wait.ms
#
# spring.kafka.consumer.properties.max.partition.fetch.bytes=1048576
#   Maximum bytes per partition per fetch response.
#   Default: 1048576 (1 MB)
#   If a single message is larger than this, it's still returned
#   (this is a soft limit for single messages).
#   Maps to: max.partition.fetch.bytes
#
#
# ============================================================================
# SECTION 8: RETRY & ERROR HANDLING (Spring-specific)
# ============================================================================
#
# These are configured via Spring beans, not application.properties.
# But here's what they do and how to set them:
#
# --- Option 1: DefaultErrorHandler (Spring Boot 3.x default) ---
#
#   Configured in a @Configuration class:
#     @Bean
#     public DefaultErrorHandler errorHandler() {
#         // Retry 3 times with 1 second backoff, then skip the record
#         return new DefaultErrorHandler(
#             new FixedBackOff(1000L, 3L)  // interval, maxAttempts
#         );
#     }
#
#   Default behavior (no custom bean):
#     - Retries 10 times with no backoff (FixedBackOff(0L, 9L))
#     - After 10 failures, logs the error and skips the record
#
# --- Option 2: Dead Letter Topic (send failed records to a DLT) ---
#
#     @Bean
#     public DefaultErrorHandler errorHandler(KafkaTemplate<String, Object> template) {
#         DeadLetterPublishingRecoverer recoverer =
#             new DeadLetterPublishingRecoverer(template);
#         return new DefaultErrorHandler(
#             recoverer,
#             new FixedBackOff(1000L, 3L)
#         );
#     }
#   After 3 retries, sends the failed record to "order-events.DLT" topic
#   (original topic name + ".DLT" suffix).
#
# --- Option 3: @RetryableTopic annotation (declarative) ---
#
#     @RetryableTopic(
#         attempts = "3",
#         backoff = @Backoff(delay = 1000, multiplier = 2.0),
#         dltTopicSuffix = ".dead-letter"
#     )
#     @KafkaListener(topics = "order-events")
#     public void consume(Order order) { ... }
#
#   Creates retry topics automatically:
#     order-events-retry-0, order-events-retry-1, order-events.dead-letter
#   Each retry goes to the next retry topic with increasing delay.

#
#
# ============================================================================
# SECTION 9: INTERCEPTORS & MISC
# ============================================================================
#
# spring.kafka.consumer.properties.interceptor.classes=com.eda.consumer.MyConsumerInterceptor
#   Comma-separated list of ConsumerInterceptor classes.
#   Called before records reach your listener (for logging, metrics, etc.)
#   Maps to: interceptor.classes
#
# spring.kafka.consumer.properties.request.timeout.ms=30000
#   How long consumer waits for a response from broker for any request.
#   Default: 30000ms (30 seconds)
#   Maps to: request.timeout.ms
#
# spring.kafka.consumer.properties.connections.max.idle.ms=540000
#   Close idle connections after this time.
#   Default: 540000ms (9 minutes)
#   Maps to: connections.max.idle.ms
#
# spring.kafka.consumer.properties.metadata.max.age.ms=300000
#   Force metadata refresh after this time (even if no errors).
#   Default: 300000ms (5 minutes)
#   Maps to: metadata.max.age.ms
#
# spring.kafka.consumer.properties.reconnect.backoff.ms=50
#   Wait time before reconnecting to a broker after connection failure.
#   Default: 50ms
#   Maps to: reconnect.backoff.ms
#
# spring.kafka.consumer.properties.reconnect.backoff.max.ms=1000
#   Maximum wait time for reconnection backoff (exponential).
#   Default: 1000ms
#   Maps to: reconnect.backoff.max.ms
#
# spring.kafka.consumer.properties.retry.backoff.ms=100
#   Wait time before retrying a failed request to broker.
#   Default: 100ms
#   Maps to: retry.backoff.ms
#
# spring.kafka.consumer.properties.isolation.level=read_uncommitted
#   For transactional producers:
#     read_uncommitted (default) ? read all messages including uncommitted
#     read_committed ? only read committed transactional messages
#   Maps to: isolation.level
#
#
# ============================================================================
# SECTION 10: QUICK REFERENCE ? WHAT YOU'LL ACTUALLY USE
# ============================================================================
#
# --- Minimal setup (what we have now) ---
#   spring.kafka.bootstrap-servers=localhost:9092
#   spring.kafka.consumer.group-id=order-consumer-group
#   spring.kafka.consumer.key-deserializer=...StringDeserializer
#   spring.kafka.consumer.value-deserializer=...JsonDeserializer
#   spring.kafka.consumer.properties.spring.json.trusted.packages=com.eda.*
#   spring.kafka.consumer.auto-offset-reset=earliest
#
# --- Add when you need reliability ---
#   spring.kafka.listener.ack-mode=MANUAL          (explicit offset control)
#   spring.kafka.consumer.properties.max.poll.records=100  (smaller batches)
#   + ErrorHandlingDeserializer wrapper
#   + DefaultErrorHandler with DeadLetterPublishingRecoverer
#
# --- Add when you need performance ---
#   spring.kafka.listener.concurrency=3             (parallel consumers)
#   spring.kafka.consumer.properties.fetch.min.bytes=10000 (batch fetches)
#   spring.kafka.listener.type=batch                (batch processing)
#
# --- Add when you need stability ---
#   spring.kafka.consumer.group-instance-id=${HOSTNAME}  (static membership)
#   spring.kafka.consumer.properties.partition.assignment.strategy=
#     ...CooperativeStickyAssignor                   (smooth rebalances)
#   spring.kafka.consumer.properties.session.timeout.ms=30000
#   spring.kafka.consumer.properties.max.poll.interval.ms=600000
#
# --- Add for production (security) ---
#   spring.kafka.properties.security.protocol=SASL_SSL
#   spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
#   spring.kafka.properties.sasl.jaas.config=...
#   spring.kafka.ssl.trust-store-location=...
#   spring.kafka.ssl.trust-store-password=...