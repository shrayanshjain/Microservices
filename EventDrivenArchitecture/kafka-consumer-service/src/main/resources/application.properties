server.port=8082
spring.application.name=kafka-consumer-service

spring.kafka.bootstrap-servers=localhost:9092,localhost:9192

spring.kafka.consumer.group-id=order-consumer-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.eda.consumer.*




# 5. Type mapping ? producer sends __TypeId__=com.eda.producer.model.Order
#    but we have com.eda.consumer.model.Order (different package!)
#    This tells JsonDeserializer: "producer's Order = my Order"
#spring.kafka.consumer.properties.spring.json.type.mapping=com.eda.producer.model.Order:com.eda.consumer.model.Order

# ?? THAT'S IT. Everything else below is DEFAULT. ??
#
# What Spring Boot gives you for FREE (you don't write any of this):
#
#   auto-offset-reset = latest        ? if no committed offset, start from latest
#   enable.auto.commit = false         ? Spring manages commits, not Kafka client
#   max.poll.records = 500             ? up to 500 records per poll()
#   session.timeout.ms = 45000        ? 45s before broker considers consumer dead
#   heartbeat.interval.ms = 3000       ? heartbeat every 3s
#   max.poll.interval.ms = 300000      ? 5 min max between poll() calls
#   fetch.min.bytes = 1                ? return immediately even with 1 byte
#   fetch.max.wait.ms = 500            ? or wait max 500ms for fetch.min.bytes
#   AckMode = BATCH                    ? auto-commit after each poll() batch
#   concurrency = 1                    ? 1 consumer thread
#   partition.assignment.strategy = RangeAssignor, CooperativeStickyAssignor
#
# We are NOT creating any @Configuration class.
# Spring Boot auto-configures:
#   - ConsumerFactory (from properties above)
#   - ConcurrentKafkaListenerContainerFactory (wraps ConsumerFactory)
#   - KafkaMessageListenerContainer (runs the poll loop)
#
# All you need is a @KafkaListener method. That's it.

