# 1. RECAP - What We Learned in Polling
# ===============================================================================
#
# In the Polling approach (pollingDemo), our app did this:
#
#   @Transactional
#   public Order createOrder(OrderRequest request) {
#       Order order = orderRepository.save(order);
#       OutboxEvent event = outboxRepository.save(event);   // saved to DB
#       return order;
#   }
#
# Then a POLLER (background thread) ran every 5 seconds:
#
#   @Scheduled(fixedDelay = 5000)
#   public void pollAndPublish() {
#       List<OutboxEvent> events = outboxRepo.findUnpublished();  // SELECT query
#       for (OutboxEvent event : events) {
#           kafkaTemplate.send(topic, event.getPayload());        // send to Kafka
#           event.setPublished(true);                             // mark done
#           outboxRepo.save(event);
#       }
#   }
#
# PROBLEMS with Polling:
#   1. Latency     - events wait up to 5 seconds (or whatever your poll interval is)
#   2. DB Load     - constant SELECT queries even when nothing changed
#   3. Scaling     - multiple instances need FOR UPDATE SKIP LOCKED (complex)
#   4. Your code   - needs KafkaTemplate, spring-kafka dependency, poller logic
#
#
# ===============================================================================
# 2. WHAT IS CDC (Change Data Capture)?
# ===============================================================================
#
# CDC = "Don't ASK the database for changes. Let the database TELL you."
#
# Analogy:
#
#   POLLING = You keep calling your friend every 5 minutes:
#             "Any new messages? Any new messages? Any new messages?"
#             Friend: "No... No... No... YES! Here's one."
#             Wasteful. Annoying. Delayed.
#
#   CDC     = Your friend has WhatsApp notifications ON.
#             The moment they get a message, YOU get notified instantly.
#             No asking. No delay. No wasted effort.
#
# How does CDC work technically?
#
#   Every database writes a LOG before making changes:
#
#   PostgreSQL calls it: WAL (Write-Ahead Log)
#   MySQL calls it:      Binlog (Binary Log)
#   MongoDB calls it:    Oplog (Operations Log)
#
#   These logs exist for CRASH RECOVERY - the database writes the change
#   to the log FIRST, then applies it to the actual table. If the DB crashes
#   mid-write, it replays the log to recover.
#
#   CDC = "Hey, that log you're already writing for crash recovery?
#          Let me READ it to capture all your changes in real-time."
#
#   The database is ALREADY writing this log. CDC just reads it.
#   ZERO extra work for the database. That's why CDC is so efficient.
#
#
# ===============================================================================
# 3. WAL (Write-Ahead Log) - How PostgreSQL Records Changes
# ===============================================================================
#
# When you run:
#   INSERT INTO orders VALUES (1, 'laptop', 999.99);
#
# PostgreSQL does NOT directly write to the orders table file.
# It follows this sequence:
#
#   Step 1: Write to WAL first (pg_wal/ directory)
#           +-----------------------------------------+
#           | LSN 0/1A3B4C0: INSERT                   |
#           |   table = public.orders                  |
#           |   new_row = {id:1, name:'laptop', ...}   |
#           +-----------------------------------------+
#
#   Step 2: Return "success" to your app
#
#   Step 3: Eventually flush to actual table file (background process)
#
# LSN = Log Sequence Number
#   Think of it as a "page number" in the WAL diary.
#   LSN 0/1A3B4C0 means: "byte position 0x1A3B4C0 in the WAL"
#   Every change gets a unique, increasing LSN.
#
# WAL Levels (important!):
#
#   wal_level = minimal   -> Bare minimum for crash recovery. No replication.
#   wal_level = replica   -> DEFAULT. Enough for physical replicas (byte copy).
#   wal_level = logical   -> Writes DECODED row data. CDC needs this!
#
#   minimal:  "Block 42 changed at offset 128"     -> meaningless to CDC
#   replica:  "Page data for block 42: 0xAB12..."   -> raw bytes, not useful
#   logical:  "INSERT into orders: {id:1, name:'laptop', price:999.99}"
#             ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
#             THIS is what Debezium can read! Human-readable changes.
#
# That's why we changed wal_level to 'logical' in the setup.
# Without it, the WAL contains raw bytes that CDC tools cannot decode.
#
#
# ===============================================================================
# 4. PUBLICATION - Filtering What to Stream
# ===============================================================================
#
# Problem: WAL contains changes for ALL tables in the database.
#          orders, users, products, outbox_events, sessions, logs...
#          Debezium only wants outbox_events changes.
#
# Solution: PostgreSQL PUBLICATION
#
#   A Publication = a FILTER on the WAL stream.
#   "Only send me changes from THESE specific tables."
#
#   CREATE PUBLICATION dbz_publication FOR TABLE public.outbox_events;
#
#   Now PostgreSQL knows:
#     INSERT into orders        -> NOT in publication -> skip
#     INSERT into outbox_events -> IN publication     -> stream it!
#     UPDATE users              -> NOT in publication -> skip
#     DELETE from outbox_events -> IN publication     -> stream it!
#
# Analogy:
#   WAL = A newspaper that prints EVERY story (sports, politics, weather, etc.)
#   Publication = Your subscription: "I only want the SPORTS section"
#
# You can verify your publications:
#   SELECT * FROM pg_publication;
#   SELECT * FROM pg_publication_tables;  -- which tables are in which publication
#
#
# WARNING: If Debezium is down for too long, WAL files pile up and
# can fill your disk! Monitor your replication slots in production.
#
#   SELECT slot_name, active, pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn)
#   AS lag_bytes FROM pg_replication_slots;
#
# "pgoutput" = PostgreSQL's built-in logical decoding plugin.
#   It converts raw WAL bytes into a structured stream of changes.
#   No extra installation needed - comes with PostgreSQL 10+.
#
#
# ===============================================================================
# 6. WHAT IS DEBEZIUM? (Not a DB, Not a standalone app)
# ===============================================================================
#
# Debezium is a SET OF PLUGINS (JAR files) that run INSIDE Kafka Connect.
#
#   Kafka         = Message broker (you already know this)
#   Kafka Connect = A FRAMEWORK that comes WITH Kafka for moving data in/out
#   Debezium      = A PLUGIN you install INTO Kafka Connect
#
# Analogy:
#   Chrome        = the browser               (Kafka Connect)
#   AdBlocker     = a plugin you install in it (Debezium)
#   Chrome runs AdBlocker. You don't run AdBlocker separately.
#
# Similarly:
#   Kafka Connect runs Debezium. You don't run Debezium separately.
#
# Kafka Connect has a REST API on port 8083:
#   POST /connectors         -> register a new connector (like Debezium)
#   GET  /connectors         -> list all running connectors
#   GET  /connectors/{name}/status  -> check health
#   DELETE /connectors/{name}       -> remove a connector
#
# When you start Kafka Connect with Debezium plugin:
#   1. Kafka Connect loads Debezium JARs from the plugin directory
#   2. Debezium connects to PostgreSQL as a replication client
#   3. Creates (or uses) a replication slot
#   4. Reads decoded WAL changes in real-time
#   5. Converts each change to a Kafka message
#   6. Publishes to Kafka topic
#
# The complete flow:
#
#   Your App                PostgreSQL              Kafka Connect          Kafka
#   --------                ----------              -------------          -----
#   INSERT order     ->     WAL written      ->     Debezium reads  ->    Topic:
#   INSERT outbox    ->     Publication      ->     WAL stream      ->    cdc.public.
#   (commit)         ->     filters it       ->     converts to     ->    outbox_events
#                                                   Kafka message
#
# Your app has NO IDEA about Kafka. It just writes to the database.
# Debezium handles everything else.
#
#
# ===============================================================================
# 7. DEBEZIUM INTERNAL PHASES
# ===============================================================================
#
# When Debezium starts for the FIRST TIME:
#
# Phase 1: SNAPSHOT (one-time)
#   "I've never read this database before. Let me get current state."
#   1. Briefly lock the table
#   2. Record current WAL position (LSN)
#   3. SELECT * FROM outbox_events (full table scan)
#   4. Publish all existing rows to Kafka with op="r" (read)
#   5. Release lock
#   6. Save WAL position
#
# Phase 2: STREAMING (forever)
#   "Now I'll tail the WAL for new changes."
#   1. Connect to replication slot
#   2. Receive decoded WAL entries
#   3. Convert to Kafka messages with op="c" (create), "u" (update), "d" (delete)
#   4. Produce to Kafka
#   5. Acknowledge LSN to PostgreSQL
#   6. Repeat forever
#
# If Debezium CRASHES and restarts:
#   "I have a saved offset in Kafka's internal topic."
#   1. Read last confirmed LSN from Kafka offset topic
#   2. Resume WAL stream from that exact position
#   3. No snapshot needed. No data loss.
#
# snapshot.mode options:
#   initial           -> snapshot first time, then stream (DEFAULT, recommended)
#   always            -> snapshot every time connector starts
#   never             -> skip snapshot, only stream new changes
#   initial_only      -> snapshot only, no streaming (for migration use cases)
#
#
# ===============================================================================
# 8. SETUP GUIDE - Download Links & Tools
# ===============================================================================
#
# ---- STEP 1: Install PostgreSQL ----
#
# Download Links:
#   Windows:  https://www.enterprisedb.com/downloads/postgres-postgresql-downloads
#             (Download the installer, click Next-Next-Finish. It includes pgAdmin!)
#
#   macOS:    brew install postgresql@16
#             (If you don't have Homebrew: https://brew.sh)
#
#   Linux:    sudo apt install postgresql-16   (Ubuntu/Debian)
#             sudo yum install postgresql16    (CentOS/RHEL)
#
# Start PostgreSQL:
#   macOS:    brew services start postgresql@16
#   Windows:  It starts automatically as a Windows Service
#   Linux:    sudo systemctl start postgresql
#
#
# ---- STEP 2: Use pgAdmin (GUI) Instead of Command Line ----
#
# psql command line is NOT beginner-friendly. Use pgAdmin instead!
#
# Download pgAdmin:
#   All platforms: https://www.pgadmin.org/download/
#   macOS:         brew install --cask pgadmin4
#   Windows:       Comes bundled with PostgreSQL installer!
#
# How to connect in pgAdmin:
#   1. Open pgAdmin
#   2. Right-click "Servers" -> "Register" -> "Server"
#   3. General tab:  Name = "Local PostgreSQL"
#   4. Connection tab:
#        Host:     localhost
#        Port:     5432
#        Username: postgres (or your OS username on macOS)
#        Password: (empty on macOS, or whatever you set on Windows)
#   5. Click "Save"
#
# Now you can:
#   - Browse tables visually (no SQL needed to VIEW data)
#   - Click "Query Tool" to run SQL commands
#   - See table data by right-clicking table -> "View/Edit Data"
#   - Much easier than remembering psql commands!
#
# Other alternatives:
#   DBeaver (free):   https://dbeaver.io/download/
#                     Works with PostgreSQL, MySQL, Oracle, etc.
#   Postico (macOS):  brew install --cask postico
#                     Clean, simple UI. Free version available.
#
#
# ---- STEP 3: Configure PostgreSQL for CDC ----
#
# Find your postgresql.conf:
#   macOS:   /opt/homebrew/var/postgresql@16/postgresql.conf
#   Windows: C:\Program Files\PostgreSQL\16\data\postgresql.conf
#   Linux:   /etc/postgresql/16/main/postgresql.conf
#
# Change these 3 settings:
#   wal_level = logical                  (DEFAULT is 'replica' - must change!)
#   max_replication_slots = 4            (how many CDC consumers allowed)
#   max_wal_senders = 4                  (how many WAL streaming connections)
#
# RESTART PostgreSQL after changing:
#   macOS:   brew services restart postgresql@16
#   Windows: Restart from Services panel (services.msc)
#   Linux:   sudo systemctl restart postgresql
#
# Verify:
#   In pgAdmin Query Tool (or psql): SHOW wal_level;
#   Should show: logical
#
#
# ---- STEP 4: Create Database & User ----
#
# In pgAdmin Query Tool (or psql):
#
#   CREATE DATABASE outbox_cdc;
#   CREATE USER debezium_user WITH PASSWORD 'debezium123';
#   GRANT ALL PRIVILEGES ON DATABASE outbox_cdc TO debezium_user;
#   ALTER USER debezium_user WITH REPLICATION;
#
# Then connect to outbox_cdc database and run:
#   GRANT ALL ON SCHEMA public TO debezium_user;
#
# Why REPLICATION permission?
#   Normal DB users can only run SELECT/INSERT/UPDATE.
#   REPLICATION lets the user connect as a WAL streaming client.
#   This is a special TCP protocol - not regular SQL.
#   Debezium uses this protocol to read the WAL in real-time.
#
#
# ---- STEP 5: Create Tables ----
#
# Connect to outbox_cdc database and run:
#
#   CREATE TABLE orders (
#       id SERIAL PRIMARY KEY,
#       order_id VARCHAR(255) UNIQUE NOT NULL,
#       customer_id VARCHAR(255) NOT NULL,
#       product_id VARCHAR(255) NOT NULL,
#       quantity INT NOT NULL,
#       total_amount DOUBLE PRECISION NOT NULL,
#       status VARCHAR(255) NOT NULL,
#       created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
#   );
#
#   CREATE TABLE outbox_events (
#       id VARCHAR(36) PRIMARY KEY,
#       aggregate_type VARCHAR(255) NOT NULL,
#       aggregate_id VARCHAR(255) NOT NULL,
#       event_type VARCHAR(255) NOT NULL,
#       payload TEXT NOT NULL,
#       created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
#   );
#
# NOTICE: No "published" column!
#   In polling, you needed published=true/false to track what was sent.
#   In CDC, Debezium tracks position using WAL LSN (stored in Kafka offset topic).
#   The outbox table doesn't need to know anything about publishing.
#
#
# ---- STEP 6: Create Publication ----
#
# Run as superuser (your OS user or postgres user):
#
#   CREATE PUBLICATION dbz_publication FOR TABLE public.outbox_events;
#
# This tells PostgreSQL: "Stream only outbox_events changes to replication clients."
# Debezium will use this publication.
#
# Why not let Debezium create it?
#   Debezium tries: CREATE PUBLICATION FOR ALL TABLES (needs superuser)
#   We do:          CREATE PUBLICATION FOR TABLE outbox_events (specific + secure)
#
#
# ---- STEP 7: Download Kafka (if not already installed) ----
#
# Download: https://kafka.apache.org/downloads
# Choose:   kafka_2.13-4.2.0.tgz (or latest)
#
# Extract and start:
#   tar -xzf kafka_2.13-4.2.0.tgz
#   cd kafka_2.13-4.2.0
#
# Start Kafka (KRaft mode - no Zookeeper needed):
#   bin/kafka-server-start.sh config/server.properties
#
#
# ---- STEP 8: Download Debezium Connector Plugin ----
#
# Debezium is NOT a standalone app. It's a PLUGIN (set of JAR files)
# that runs INSIDE Kafka Connect. So we need to download it and
# put it in Kafka's plugin folder.
#
# Step 8a: Go to Debezium's official download page:
#   https://debezium.io/releases/
#
# Step 8b: Download the PostgreSQL connector plugin:
#   Go to this link directly:
#     https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/3.5.0.Final/
#
#   Download this file (click on it):
#     debezium-connector-postgres-3.5.0.Final-plugin.tar.gz
#
#   (It's about ~24 MB)
#
# Step 8c: Create a "plugins" folder inside your Kafka directory:
#   (Open Terminal / Command Prompt)
#
#   cd /path/to/your/kafka_2.13-4.2.0       <-- go to your Kafka folder
#   mkdir plugins                            <-- create plugins folder
#
# Step 8d: Extract the downloaded file INTO the plugins folder:
#
#   mv ~/Downloads/debezium-connector-postgres-3.5.0.Final-plugin.tar.gz plugins/
#   cd plugins
#   tar -xzf debezium-connector-postgres-3.5.0.Final-plugin.tar.gz
#   rm debezium-connector-postgres-3.5.0.Final-plugin.tar.gz    <-- cleanup
#
# Step 8e: Verify your folder structure looks like this:
#
#   kafka_2.13-4.2.0/
#   +-- bin/                                  (Kafka scripts)
#   +-- config/                               (config files)
#   +-- libs/                                 (Kafka JARs)
#   +-- plugins/                              <-- YOU CREATED THIS
#       +-- debezium-connector-postgres/      <-- EXTRACTED HERE
#           +-- debezium-connector-postgres-3.5.0.Final.jar
#           +-- debezium-api-3.5.0.Final.jar
#           +-- protobuf-java-*.jar
#           +-- postgresql-*.jar              (JDBC driver)
#           +-- ... (15-20 dependency JARs)
#
# That's it! Kafka Connect will automatically find these JARs
# when you tell it where the plugins folder is (next step).
#
#
# ---- STEP 9: Configure Kafka Connect ----
#
# Edit: kafka/config/connect-standalone.properties
#
# Change these lines:
#   key.converter.schemas.enable=false        (cleaner JSON output)
#   value.converter.schemas.enable=false      (cleaner JSON output)
#   plugin.path=/path/to/kafka/plugins        (where Debezium JARs are)
#
# What is connect-standalone.properties?
#   This is the Kafka Connect WORKER config.
#   It tells Kafka Connect:
#     - Which Kafka broker to use (bootstrap.servers)
#     - What format to use for messages (converters)
#     - Where to find plugins like Debezium (plugin.path)
#     - Where to store offsets (offset.storage.file.filename)
#
#
# ---- STEP 10: Create Debezium Connector Config ----
#
# Create file: kafka/config/debezium-postgres-connector.properties
#
#   name=outbox-connector
#   connector.class=io.debezium.connector.postgresql.PostgresConnector
#
#   # Database connection
#   database.hostname=localhost
#   database.port=5432
#   database.user=debezium_user
#   database.password=debezium123
#   database.dbname=outbox_cdc
#
#   # Unique prefix for Kafka topics
#   topic.prefix=cdc
#
#   # Only watch outbox_events table
#   table.include.list=public.outbox_events
#
#   # Replication slot name
#   slot.name=debezium_slot
#
#   # Logical decoding plugin (built into PostgreSQL)
#   plugin.name=pgoutput
#
#   # Snapshot mode
#   snapshot.mode=initial
#
#   # Don't auto-create publication (we created it manually)
#   publication.autocreate.mode=disabled
#
#   # Schema history tracking
#   schema.history.internal.kafka.bootstrap.servers=localhost:9092
#   schema.history.internal.kafka.topic=schema-changes.outbox
#
# Config explained:
#   name                      -> Unique name for this connector instance
#   connector.class           -> Which Debezium plugin to use (Postgres version)
#   topic.prefix              -> Kafka topics will be: {prefix}.{schema}.{table}
#                                So: cdc.public.outbox_events
#   table.include.list        -> ONLY capture these tables (ignore all others)
#   slot.name                 -> Name of the replication slot in PostgreSQL
#   plugin.name               -> pgoutput = PostgreSQL's built-in WAL decoder
#   publication.autocreate.mode -> disabled = don't try to create publication
#                                  (we created it manually to avoid superuser)
#
#
# ---- STEP 11: Start Kafka Connect with Debezium ----
#
# Run from your Kafka directory:
#
#   bin/connect-standalone.sh \
#     config/connect-standalone.properties \
#     config/debezium-postgres-connector.properties
#
# First argument:  Kafka Connect worker config
# Second argument: Debezium connector config
#
# You should see in logs:
#   "Connector 'outbox-connector' started"
#   "user 'debezium_user' connected to database 'outbox_cdc'"
#   "Snapshot completed"
#   "Processing messages"    <- Debezium is now tailing the WAL!
#
#
# ---- STEP 12: Test It! ----
#
# Terminal 1: Start a Kafka consumer to watch the topic
#   bin/kafka-console-consumer.sh \
#     --bootstrap-server localhost:9092 \
#     --topic cdc.public.outbox_events \
#     --from-beginning
#
# Terminal 2: Insert a row into outbox_events
#   psql -U debezium_user -d outbox_cdc
#   (or use pgAdmin Query Tool)
#
#   INSERT INTO outbox_events (id, aggregate_type, aggregate_id, event_type, payload)
#   VALUES ('evt-001', 'Order', 'ORD-001', 'ORDER_CREATED',
#           '{"orderId":"ORD-001","customerId":"CUST-001","amount":299.99}');
#
# Terminal 1 should IMMEDIATELY show the message!
# No polling. No delay. Pure WAL streaming.
#
#
# ===============================================================================
# 9. DEBEZIUM MESSAGE FORMAT - What You See in Kafka
# ===============================================================================
#
# When you INSERT a row, Debezium sends this JSON to Kafka:
#
#   {
#     "before": null,                          <-- old row (null for INSERT)
#     "after": {                               <-- new row
#       "id": "evt-001",
#       "aggregate_type": "Order",
#       "aggregate_id": "ORD-001",
#       "event_type": "ORDER_CREATED",
#       "payload": "{\"orderId\":\"ORD-001\",...}",
#       "created_at": 1714300000000
#     },
#     "source": {
#       "version": "3.5.0.Final",
#       "connector": "postgresql",
#       "db": "outbox_cdc",
#       "schema": "public",
#       "table": "outbox_events",
#       "txId": 1234,                          <-- postgres transaction ID
#       "lsn": 234567890,                      <-- WAL position
#       "ts_ms": 1714300000123                 <-- timestamp of DB change
#     },
#     "op": "c",                               <-- operation type
#     "ts_ms": 1714300000456                   <-- timestamp of Debezium processing
#   }
#
# Operation types ("op" field):
#   "c" = CREATE  (INSERT)
#   "u" = UPDATE
#   "d" = DELETE
#   "r" = READ    (during initial snapshot)
#
# "before" field:
#   INSERT: before = null (no previous row)
#   UPDATE: before = {old values}  (only PK by default, see REPLICA IDENTITY)
#   DELETE: before = {deleted row values}
#
# "source" field:
#   Contains metadata about WHERE this change came from.
#   txId = PostgreSQL transaction ID (useful for grouping changes in same transaction)
#   lsn  = WAL position (useful for debugging)
#
#
# ===============================================================================
# 10. POLLING vs CDC - Complete Comparison
# ===============================================================================
#
# +------------------------+--------------------------------+
# |       POLLING           |         CDC (Debezium)          |
# +------------------------+--------------------------------+
# | Your app polls DB       | DB pushes changes to Debezium  |
# | every N seconds         | in real-time (milliseconds)    |
# |                         |                                |
# | SELECT ... FOR          | Reads WAL stream               |
# | UPDATE SKIP LOCKED      | (no queries at all!)           |
# |                         |                                |
# | Latency: 5-30 seconds   | Latency: ~100ms               |
# |                         |                                |
# | DB load: constant       | DB load: near zero             |
# | polling queries          | (WAL is written anyway)       |
# |                         |                                |
# | Simple setup            | Needs Kafka Connect +          |
# | (just Java code)        | Debezium (more infrastructure) |
# |                         |                                |
# | Needs: spring-kafka     | Producer app does NOT need     |
# | KafkaTemplate, Poller   | spring-kafka at all!           |
# |                         |                                |
# | Outbox table needs      | Outbox table does NOT need     |
# | "published" column      | "published" column             |
# |                         |                                |
# | Good for: low volume,   | Good for: high volume,         |
# | simple systems, POC     | production, real-time systems  |
# +------------------------+--------------------------------+
#
# Code comparison:
#
#   POLLING (your pollingDemo):
#     OrderService.java        <- saves order + outbox event
#     OutboxPoller.java        <- @Scheduled, polls DB, sends to Kafka
#     KafkaTemplate            <- needed in your app
#     spring-kafka dependency  <- needed in pom.xml
#
#   CDC (Debezium):
#     OrderService.java        <- saves order + outbox event (SAME!)
#     NO OutboxPoller.java     <- Debezium replaces this
#     NO KafkaTemplate         <- Debezium publishes for you
#     NO spring-kafka          <- not needed in producer app!
#
#
# ===============================================================================
# 11. PRODUCTION TIPS
# ===============================================================================
#
# 1. Monitor replication slot lag:
#    SELECT slot_name, active,
#           pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn) AS lag_bytes
#    FROM pg_replication_slots;
#    If lag_bytes keeps growing = Debezium is falling behind = disk fills up!
#
# 2. Outbox Event Router (SMT):
#    In production, you add a "Single Message Transform" to Debezium config.
#    It transforms the raw CDC message:
#      FROM: topic = cdc.public.outbox_events, value = {before, after, source, op}
#      TO:   topic = order-events (based on aggregate_type), value = just the payload
#    This makes consumer code much simpler.
#
# 3. Kafka Connect modes:
#    Standalone mode  = single process (what we used, good for learning)
#    Distributed mode = multiple workers, automatic failover (production)
#
# 4. Clean up old outbox events:
#    Since CDC reads from WAL (not the table), you can DELETE old rows!
#    Schedule a cleanup job: DELETE FROM outbox_events WHERE created_at < NOW() - INTERVAL '7 days'
#    This keeps the table small. Debezium doesn't care - it reads WAL, not the table.
#
# 5. Multiple databases:
#    Each database needs its own Debezium connector instance.
#    Each connector = separate replication slot = separate Kafka topics.
#
